<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<script>try{var _ql=(new URLSearchParams(location.search).get('lang')||'').toLowerCase();var _qok=(_ql==='en'||_ql==='es');var _st=localStorage.getItem('bpuppy-lang');var _auto=(((navigator.language||navigator.userLanguage||'')+'').toLowerCase().indexOf('es')===0)?'es':'en';var _bl=_qok?_ql:(_st||_auto);window.__BP_LANG=_bl;document.documentElement.lang=_bl;}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>¡Felicidades! — BrightPuppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="icon" href="assets/logo.webp">
<style>
  :root{ --orange:#F58220; --ink:#2D2421; --ink-2:#5C4F48; --soft:#8a7a6e; --paper:#FAF6F0; --line:#ece2d6; --wh:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,Arial,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .topbar{ display:flex; align-items:center; gap:9px; padding:16px 22px; border-bottom:1px solid var(--line); background:var(--wh); }
  .topbar img{ width:30px; height:30px; border-radius:8px; }
  .topbar b{ font-size:17px; letter-spacing:-0.02em; } .topbar b span{ color:var(--orange); }
  .wrap{ max-width:640px; margin:0 auto; padding:34px 20px 70px; text-align:center; }
  .eyebrow{ font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--orange); }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(30px,7vw,52px); letter-spacing:-0.03em; line-height:1.02; margin:10px 0 6px; }
  h1 em{ font-family:'Instrument Serif',serif; font-style:italic; color:var(--orange); }
  .sub{ font-size:16px; color:var(--ink-2); line-height:1.6; margin:0 auto 26px; max-width:42ch; }
  /* Badge */
  .badge{ position:relative; display:inline-flex; flex-direction:column; align-items:center; gap:8px; padding:22px 30px; border-radius:20px; background:var(--wh); margin:0 auto 30px; }
  .badge::before{ content:""; position:absolute; inset:0; border-radius:20px; padding:2.5px; background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3aafff,#a86bff,#ff5f6d); background-size:300% 100%; -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:bpr 5s linear infinite; }
  @keyframes bpr{ 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
  .medal{ width:54px; height:54px; color:var(--orange); }
  .badge .bt{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
  .badge .bn{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:21px; letter-spacing:-0.02em; }
  /* CTAs */
  .ctas{ display:flex; flex-direction:column; gap:12px; max-width:380px; margin:0 auto 38px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:15px 22px; border-radius:14px; font-weight:800; font-size:15px; text-decoration:none; cursor:pointer; border:none; font-family:inherit; }
  .btn svg{ width:20px; height:20px; }
  .btn-p{ background:var(--orange); color:#fff; box-shadow:0 8px 22px rgba(245,130,32,.32); }
  .btn-s{ background:var(--wh); color:var(--ink); border:1.5px solid var(--line); }
  .btn-g{ background:#111827; color:#fff; }
  /* Journey */
  .jrny{ text-align:left; background:var(--wh); border:1px solid var(--line); border-radius:18px; padding:20px 18px; }
  .jrny h2{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:20px; letter-spacing:-0.02em; margin:0 0 4px; text-align:center; }
  .jrny .jt{ font-size:13px; color:var(--soft); text-align:center; margin:0 0 16px; }
  .ach{ display:flex; gap:13px; align-items:flex-start; padding:12px 6px; border-bottom:1px solid var(--line); }
  .ach:last-child{ border-bottom:none; }
  .ach .ic{ flex:0 0 42px; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--paper); color:var(--soft); }
  .ach.done .ic{ background:#FFF1E4; color:var(--orange); }
  .ach .ic svg{ width:21px; height:21px; }
  .ach .att{ font-weight:800; font-size:14.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .ach .ad{ font-size:12.5px; color:var(--ink-2); line-height:1.5; margin-top:2px; }
  .pill{ font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px; }
  .pill.on{ background:#E7F8EF; color:#1EB87A; } .pill.off{ background:var(--paper); color:var(--soft); border:1px solid var(--line); }
  .foot{ margin-top:34px; font-size:13px; color:var(--soft); }
  .foot b{ color:var(--orange); }
  /* Confetti */
  #cf{ position:fixed; inset:0; pointer-events:none; z-index:50; }
  .cfp{ position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; opacity:.9; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(105vh) rotate(720deg); opacity:.6; } }
</style>
</head>
<body>
  <div class="topbar"><img src="assets/logo.webp" alt="" onerror="this.style.display='none'"><b>Bright<span>Puppy</span></b></div>
  <div id="cf"></div>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">¡Pago recibido!</div>
    <h1 id="h1">¡Felicidades!</h1>
    <p class="sub" id="sub"></p>

    <div class="badge">
      <svg class="medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14.5 7.5 22l4.5-2.6L16.5 22 15 14.5"/><path d="M12 6.5l.9 1.8 2 .3-1.45 1.4.34 2-1.79-.94-1.79.94.34-2L9.1 8.6l2-.3z" fill="currentColor" stroke="none"/></svg>
      <div class="bt" id="badge-t">Nuevo logro</div>
      <div class="bn" id="badge-n">Nuevo padre</div>
    </div>

    <div class="ctas">
      <a class="btn btn-p" id="cta-game" href="/quiz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 12h3M8.5 10.5v3"/><circle cx="16" cy="11" r="1"/><circle cx="18.5" cy="13.5" r="1"/></svg>
        <span id="cta-game-t">Juega nuestro juego</span>
      </a>
      <a class="btn btn-s" id="cta-comm" href="/social">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/></svg>
        <span id="cta-comm-t">Únete a la comunidad</span>
      </a>
    </div>

    <div class="jrny">
      <h2 id="jt">Tu camino en la comunidad</h2>
      <p class="jt" id="jsub">Ve desbloqueando logros con tu cachorro.</p>
      <div id="ach-list"></div>
    </div>

    <div class="foot"><b id="foot-tag">Expertos llevando la alegría a los hogares desde 2012.</b><br>
      <a id="cta-home" href="/" style="color:var(--soft);font-weight:700;text-decoration:underline;margin-top:8px;display:inline-block">Ir a BrightPuppy</a>
    </div>
  </div>

<script>
(function(){
  var EN = (window.__BP_LANG==='en');
  function T(es,en){ return EN?en:es; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function qp(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }
  var pet = (qp('pet')||'').trim();
  var name = (qp('name')||'').trim();
  var lq = window.__BP_LANG;

  document.getElementById('eyebrow').textContent = T('¡Pago recibido!','Payment received!');
  document.getElementById('h1').innerHTML = name ? (T('¡Felicidades, ','Congrats, ')+esc(name)+'!') : T('¡Felicidades!','Congratulations!');
  document.getElementById('sub').innerHTML = T(
    'Ya eres parte de la familia BrightPuppy. Un asesor te contactará muy pronto para confirmar todo y coordinar la entrega.',
    'You are now part of the BrightPuppy family. An advisor will contact you very soon to confirm everything and coordinate delivery.');
  document.getElementById('badge-t').textContent = T('Nuevo logro desbloqueado','New achievement unlocked');
  document.getElementById('badge-n').textContent = pet ? T('Nuevo padre de '+pet, 'New parent of '+pet) : T('Nuevo padre','New parent');
  document.getElementById('cta-game-t').textContent = T('Juega nuestro juego','Play our game');
  document.getElementById('cta-comm-t').textContent = T('Únete a la comunidad','Join the community');
  document.getElementById('jt').textContent = T('Tu camino en la comunidad','Your community journey');
  document.getElementById('jsub').textContent = T('Ve desbloqueando logros con tu cachorro.','Unlock achievements with your puppy.');
  document.getElementById('foot-tag').textContent = T('Expertos llevando la alegría a los hogares desde 2012.','Experts bringing joy to homes since 2012.');
  document.getElementById('cta-home').textContent = T('Ir a BrightPuppy','Go to BrightPuppy');

  // links con idioma + datos para precargar el perfil (opt-in) en la comunidad
  var lp = lq==='en' ? '?lang=en' : '';
  document.getElementById('cta-game').href = '/quiz'+lp;
  document.getElementById('cta-home').href = '/'+lp;
  var cp = '?welcome=1'+(pet?('&pet='+encodeURIComponent(pet)):'')+(name?('&name='+encodeURIComponent(name)):'')+(lq==='en'?'&lang=en':'');
  document.getElementById('cta-comm').href = '/social'+cp;

  // Logros
  var IC = {
    medal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M9 13l-1.5 8L12 18l4.5 3L15 13"/></svg>',
    walk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M11 8l-2 4 3 2 1 6M11 12l-3 2-2 4M14 10l4 1"/></svg>',
    friend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>',
    invite:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>',
    groom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8.5 20 20M8.5 15.5 20 4"/></svg>',
    photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>'
  };
  var ACH = [
    { ic:'medal', done:true,  t:T('Nuevo padre'+(pet?' de '+pet:''),'New parent'+(pet?' of '+pet:'')), d:T('Diste el gran paso. ¡Bienvenido a la familia!','You took the big step. Welcome to the family!') },
    { ic:'walk',  done:false, t:T('Primer paseo','First walk'), d:T('Sal a caminar con tu cachorro y comparte el momento.','Take your puppy for a walk and share the moment.') },
    { ic:'friend',done:false, t:T('Tu primer amigo','Your first friend'), d:T('Conecta con otra familia BrightPuppy en la comunidad.','Connect with another BrightPuppy family in the community.') },
    { ic:'invite',done:false, t:T('Invitaste a alguien','You invited someone'), d:T('Trae a un amigo a la comunidad.','Bring a friend to the community.') },
    { ic:'groom', done:false, t:T('Primer grooming','First grooming'), d:T('Reserva el primer spa de tu cachorro.','Book your puppy’s first spa day.') },
    { ic:'photo', done:false, t:T('Primera foto','First photo'), d:T('Sube una foto de tu peludo a la comunidad.','Share a photo of your furry one in the community.') }
  ];
  document.getElementById('ach-list').innerHTML = ACH.map(function(a){
    return '<div class="ach'+(a.done?' done':'')+'">'
      + '<div class="ic">'+(IC[a.ic]||'')+'</div>'
      + '<div><div class="att">'+esc(a.t)+' <span class="pill '+(a.done?'on':'off')+'">'+(a.done?T('Logrado','Unlocked'):T('Por desbloquear','Locked'))+'</span></div>'
      + '<div class="ad">'+esc(a.d)+'</div></div>'
    + '</div>';
  }).join('');

  // Confetti (solo decorativo, CSS)
  try{
    var cf=document.getElementById('cf'); var cols=['#F58220','#47e891','#3aafff','#ff5f6d','#ffc371','#a86bff'];
    for(var i=0;i<70;i++){ var p=document.createElement('div'); p.className='cfp'; p.style.left=(Math.random()*100)+'vw'; p.style.background=cols[i%cols.length]; p.style.animationDuration=(2.6+Math.random()*2.4)+'s'; p.style.animationDelay=(Math.random()*0.8)+'s'; p.style.transform='rotate('+(Math.random()*360)+'deg)'; cf.appendChild(p); }
    setTimeout(function(){ if(cf) cf.innerHTML=''; }, 6500);
  }catch(e){}
})();
</script>
</body>
</html>
