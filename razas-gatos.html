<style>
:root{--cat-purple:#7C5CBF;--cat-light:#F3EEFA;--cat-mid:#E8D5F0}
.razas-hero{background:linear-gradient(100deg,rgba(74,53,128,0.86) 0%,rgba(74,53,128,0.55) 45%,rgba(74,53,128,0.12) 100%),url("assets/header-razas-gatos.webp") right 25%/cover no-repeat,#4A3580;color:#fff;padding:120px 0 60px;position:relative;overflow:hidden}
.razas-hero h1{font-family:var(--display);font-size:clamp(40px,7vw,84px);font-weight:600;letter-spacing:-0.03em;line-height:.95;margin:0 0 16px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.35)}
.razas-hero h1 em{font-family:var(--serif);font-style:italic;color:#E8D5F0;font-weight:400}
.razas-hero p{color:rgba(255,255,255,.9);font-size:18px;max-width:50ch;line-height:1.55;margin:0;text-shadow:0 1px 8px rgba(0,0,0,0.4)}
.filter-bar{position:sticky;top:60px;z-index:90;background:rgba(250,248,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:16px 0}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);min-width:64px}
.fchip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .2s;white-space:nowrap}
.fchip:hover{border-color:var(--cat-purple);color:var(--cat-purple)}
.fchip.on{background:var(--cat-purple);border-color:var(--cat-purple);color:#fff}
.fchip-toggle{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .2s}
.fchip-toggle.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mode-btn{padding:9px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .2s}
.mode-btn.on{background:var(--cat-purple);border-color:var(--cat-purple);color:#fff}
.search-input{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;font-family:var(--body);color:var(--ink);outline:none;min-width:200px;transition:border-color .2s}
.search-input:focus{border-color:var(--cat-purple)}
.search-input::placeholder{color:var(--ink-soft)}
.breed-section{padding:48px 0 100px}
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.results-count{font-size:14px;font-weight:600;color:var(--ink-2)}
.results-count strong{color:var(--cat-purple);font-size:18px}
.clear-btn{font-size:13px;font-weight:600;color:var(--cat-purple);background:none;border:none;cursor:pointer;padding:0}
.breed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.bcard{border-radius:20px;background:var(--paper);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s}
.bcard:hover{transform:translateY(-5px);box-shadow:0 20px 50px -15px rgba(124,92,191,.2)}
.bcard-photo{aspect-ratio:4/3;background:linear-gradient(135deg,var(--cat-light),var(--cat-mid));position:relative;overflow:hidden}
.bcard-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.bcard-photo-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;filter:drop-shadow(0 4px 12px rgba(124,92,191,.15))}
.bcard-badges{position:absolute;bottom:10px;left:10px;display:flex;gap:6px}
.bcard-badge{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(8px)}
.badge-small{background:rgba(101,182,143,.9);color:#fff}
.badge-medium{background:rgba(124,92,191,.9);color:#fff}
.badge-large{background:rgba(74,53,128,.9);color:#fff}
.badge-hypo{background:rgba(91,124,250,.9);color:#fff}
.bcard-body{padding:16px 18px}
.bcard-name{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.bcard-origin{font-size:12px;color:var(--ink-soft);margin-bottom:10px}
.bcard-dots{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.bcard-dot{width:8px;height:8px;border-radius:50%;background:var(--cat-light)}
.bcard-dot.filled{background:var(--cat-purple)}
.bcard-stat-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.bcard-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bcard-tag{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--cat-light);color:var(--cat-purple)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--paper);border-radius:28px;max-width:860px;width:100%;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 40px 100px -20px rgba(0,0,0,.4)}
.modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;display:grid;place-items:center;font-size:18px;color:var(--ink-2);z-index:10;transition:background .2s}
.modal-close:hover{background:var(--line)}
.modal-grid{display:grid;grid-template-columns:1fr 1.4fr;min-height:400px}
.modal-photo{background:linear-gradient(135deg,var(--cat-light),var(--cat-mid));border-radius:28px 0 0 28px;display:grid;place-items:center;min-height:320px;overflow:hidden}
.modal-photo img{width:100%;height:100%;object-fit:cover;object-position:center 70%;display:block}
.modal-photo-ph{font-size:100px;filter:drop-shadow(0 8px 24px rgba(124,92,191,.15))}
.modal-body{padding:28px;overflow-y:auto}
.modal-name{font-family:var(--display);font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:-.025em;margin:0 0 4px}
.modal-origin{font-size:13px;color:var(--ink-soft);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.mstat{background:var(--cat-light);border-radius:12px;padding:10px 12px;text-align:center}
.mstat-val{font-family:var(--display);font-size:16px;font-weight:600;color:var(--cat-purple);letter-spacing:-.01em}
.mstat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-top:2px}
.reg-badges{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.reg-badge{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.06em}
.reg-tica{background:#7C5CBF;color:#fff}
.reg-cfa{background:#c0392b;color:#fff}
.rating-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rating-lbl{font-size:12px;font-weight:600;color:var(--ink-2);min-width:100px}
.rating-bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rating-fill{height:100%;border-radius:3px;background:var(--cat-purple);transition:width .6s ease}
.temperament-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.temp-chip{padding:5px 12px;border-radius:999px;background:var(--cat-light);border:1px solid var(--cat-mid);font-size:12px;font-weight:600;color:var(--cat-purple)}
.section-title{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em;margin:18px 0 8px;color:var(--ink)}
.bestfor-list{display:flex;flex-wrap:wrap;gap:6px}
.bestfor-item{padding:5px 12px;border-radius:999px;background:rgba(101,182,143,.12);border:1px solid rgba(101,182,143,.25);font-size:12px;font-weight:600;color:#2d7a4f}
.desc-text{font-size:14px;line-height:1.65;color:var(--ink-2);margin:0}
.mixes-toggle{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--cat-light);border:1px solid var(--cat-mid);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);margin-top:16px;transition:background .2s;width:100%;text-align:left}
.mixes-toggle:hover{background:var(--cat-mid)}
.mix-cards{display:grid;gap:10px;margin-top:12px}
.mix-card{padding:12px 14px;border-radius:12px;background:var(--cat-light);border:1px solid var(--cat-mid)}
.mix-card h5{font-family:var(--display);font-size:14px;font-weight:600;margin:0 0 2px;color:var(--ink)}
.mix-card .mix-parents{font-size:11px;font-weight:600;color:var(--cat-purple);margin-bottom:4px;letter-spacing:.02em}
.mix-card p{font-size:13px;color:var(--ink-2);margin:0;line-height:1.5}
.mestizo-card{max-width:720px;margin:0 auto;background:var(--paper);border-radius:28px;border:1px solid var(--line);padding:48px;text-align:center}
@media(max-width:700px){.modal-grid{grid-template-columns:1fr}.modal-photo{border-radius:28px 28px 0 0;min-height:220px}.breed-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.filter-bar{top:55px}}
</style>
