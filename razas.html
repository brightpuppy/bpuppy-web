<style>
.razas-hero{background:linear-gradient(180deg,rgba(45,36,33,0.62) 0%,rgba(45,36,33,0.12) 38%,rgba(45,36,33,0) 60%),linear-gradient(95deg,rgba(45,36,33,0.85) 0%,rgba(45,36,33,0.58) 45%,rgba(45,36,33,0.32) 100%),url("assets/header-razas.webp") right 25%/cover no-repeat,#3a2f2a;padding:120px 0 60px;position:relative;overflow:hidden;color:#fff}
.razas-hero h1{font-family:var(--display);font-size:clamp(40px,7vw,84px);font-weight:600;letter-spacing:-0.03em;line-height:.95;margin:0 0 16px;color:#fff !important;text-shadow:0 2px 12px rgba(0,0,0,0.4)}
.razas-hero h1 em{font-family:var(--serif);font-style:italic;color:#FFB877 !important;font-weight:400}
.razas-hero p{color:#F5F0EA !important;font-size:18px;max-width:50ch;line-height:1.55;margin:0;text-shadow:0 1px 8px rgba(0,0,0,0.45)}
.razas-hero a{color:rgba(255,255,255,0.85) !important}
.razas-hero .eyebrow,.razas-hero [class*="eyebrow"]{color:#FFB877 !important}
@media(max-width:700px){.razas-hero{background:linear-gradient(180deg,rgba(45,36,33,0.6) 0%,rgba(45,36,33,0.85) 100%),url("assets/header-razas.webp") center 20%/cover no-repeat}}
.filter-bar{position:sticky;top:60px;z-index:90;background:rgba(255,245,235,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:16px 0}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);min-width:64px}
.fchip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .2s;white-space:nowrap}
.fchip:hover{border-color:var(--orange);color:var(--orange)}
.fchip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.fchip-toggle{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .2s}
.fchip-toggle.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mode-btn{padding:9px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .2s}
.mode-btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search-input{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;font-family:var(--body);color:var(--ink);outline:none;min-width:200px;transition:border-color .2s}
.search-input:focus{border-color:var(--orange)}
.search-input::placeholder{color:var(--ink-soft)}
.filter-headline{padding:10px 0 4px;font-family:var(--display);font-size:15px;font-weight:600;color:var(--orange);letter-spacing:-.01em}
.breed-section{padding:48px 0 100px}
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.results-count{font-size:14px;font-weight:600;color:var(--ink-2)}
.results-count strong{color:var(--orange);font-size:18px}
.clear-btn{font-size:13px;font-weight:600;color:var(--orange);background:none;border:none;cursor:pointer;padding:0}
.breed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.bcard{border-radius:20px;background:var(--paper);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s}
.bcard:hover{transform:translateY(-5px);box-shadow:0 20px 50px -15px rgba(45,36,33,.18)}
.bcard-photo{aspect-ratio:4/3;background:linear-gradient(135deg,var(--bg-2,#FFE8D1),var(--accent-2,#FFD9B3));position:relative;overflow:hidden}
.bcard-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.bcard-photo-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:700;font-family:var(--display);color:var(--orange);opacity:.3;letter-spacing:-.05em}
.bcard-badges{position:absolute;bottom:10px;left:10px;display:flex;gap:6px}
.bcard-badge{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(8px)}
.badge-small{background:rgba(101,182,143,.9);color:#fff}
.badge-medium{background:rgba(245,130,32,.9);color:#fff}
.badge-large{background:rgba(107,68,35,.9);color:#fff}
.badge-hypo{background:rgba(91,124,250,.9);color:#fff}
.bcard-body{padding:16px 18px}
.bcard-name{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.bcard-origin{font-size:12px;color:var(--ink-soft);margin-bottom:10px}
.bcard-dots{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.bcard-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2,#FFD9B3)}
.bcard-dot.filled{background:var(--orange)}
.bcard-stat-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.bcard-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bcard-tag{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--bg,#FFF5EB);color:var(--ink-2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal{background:var(--paper);border-radius:28px;max-width:680px;width:100%;max-height:92vh;overflow:hidden;position:relative;box-shadow:0 40px 100px -20px rgba(0,0,0,.45)}
.modal-inner{overflow-y:auto;max-height:92vh;scrollbar-gutter:stable both-edges;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.modal-inner::-webkit-scrollbar{width:4px}
.modal-inner::-webkit-scrollbar-track{background:transparent}
.modal-inner::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.modal-inner::-webkit-scrollbar-thumb:hover{background:var(--ink-soft)}
.modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:none;cursor:pointer;display:grid;place-items:center;font-size:16px;color:var(--ink-2);z-index:20;transition:background .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.modal-close:hover{background:#fff}
.modal-hero{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--bg-2,#FFE8D1),var(--accent-2,#FFD9B3));border-radius:20px;overflow:hidden;flex-shrink:0;margin:10px 10px 0}
.modal-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.modal-hero-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:700;font-family:var(--display);color:var(--orange);opacity:.2}
.modal-hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,6,.78) 0%,rgba(10,8,6,.1) 55%,transparent 100%);pointer-events:none}
.modal-hero-info{position:absolute;bottom:0;left:0;right:0;padding:44px 28px 22px;pointer-events:none}
.modal-hero-name{font-family:var(--display);font-size:clamp(26px,5vw,42px);font-weight:600;color:#fff;letter-spacing:-.03em;margin:0 0 5px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.modal-hero-origin{font-size:13px;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:6px}
.modal-content{padding:22px 28px 32px}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.mstat{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:center}
.mstat-val{font-family:var(--display);font-size:16px;font-weight:600;color:var(--orange);letter-spacing:-.01em}
.mstat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-top:2px}
.reg-badges{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.reg-badge{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.06em}
.reg-akc{background:#1a3d8c;color:#fff}
.reg-fci{background:#006838;color:#fff}
.rating-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rating-lbl{font-size:12px;font-weight:600;color:var(--ink-2);min-width:100px}
.rating-bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rating-fill{height:100%;border-radius:3px;background:var(--orange);transition:width .6s ease}
.temperament-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.temp-chip{padding:5px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.section-title{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em;margin:18px 0 8px;color:var(--ink)}
.bestfor-list{display:flex;flex-wrap:wrap;gap:6px}
.bestfor-item{padding:5px 12px;border-radius:999px;background:rgba(101,182,143,.12);border:1px solid rgba(101,182,143,.25);font-size:12px;font-weight:600;color:#2d7a4f}
.desc-text{font-size:14px;line-height:1.65;color:var(--ink-2);margin:0}
.mixes-toggle{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);margin-top:16px;transition:background .2s;width:100%;text-align:left}
.mixes-toggle:hover{background:var(--bg-2)}
.mix-cards{display:grid;gap:10px;margin-top:12px}
.mix-card{padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.mix-card h5{font-family:var(--display);font-size:14px;font-weight:600;margin:0 0 2px;color:var(--ink)}
.mix-card .mix-parents{font-size:11px;font-weight:600;color:var(--orange);margin-bottom:4px}
.mix-card p{font-size:13px;color:var(--ink-2);margin:0;line-height:1.5}
.dcard{border-radius:20px;background:var(--paper);border:1px solid var(--line);padding:20px;cursor:pointer;transition:transform .3s,box-shadow .3s}
.dcard:hover{transform:translateY(-4px);box-shadow:0 16px 40px -12px rgba(245,130,32,.2);border-color:var(--orange)}
.dcard-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dcard-icon{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700;color:var(--orange);flex-shrink:0}
.dcard-name{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 0 2px}
.dcard-parents{font-size:12px;color:var(--orange);font-weight:600}
.dcard-desc{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0}
.mestizo-card{max-width:720px;margin:0 auto;background:var(--paper);border-radius:28px;border:1px solid var(--line);padding:48px;text-align:center}
@media(max-width:700px){.modal-hero{aspect-ratio:1/1}.breed-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
</style>
