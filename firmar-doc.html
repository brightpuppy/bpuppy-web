<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<script>try{var _ql=(new URLSearchParams(location.search).get('lang')||'').toLowerCase();var _bl=(_ql==='en'||_ql==='es')?_ql:((((navigator.language||navigator.userLanguage||'')+'').toLowerCase().indexOf('es')===0)?'es':'en');window.__BP_LANG=_bl;document.documentElement.lang=_bl;}catch(e){window.__BP_LANG='es';}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Firmar documento — BrightPuppy</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="assets/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Dancing+Script:wght@500;700&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script type="module">
/* pdf.js 4.x solo existe como modulo ES. Se expone en window para el script
   clasico de la pagina, que espera el evento 'bp-pdfjs'. Si falla la carga,
   firmar-doc.js cae al visor por iframe (el documento se sigue pudiendo leer). */
(async function(){
  var B='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/';
  try{
    var lib=await import(B+'pdf.min.mjs');
    lib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.mjs';
    window.pdfjsLib=lib;
  }catch(e){ window.__bpPdfjsFailed=true; }
  window.dispatchEvent(new Event('bp-pdfjs'));
})();
</script>
<style>
:root{
  --orange:#F58220;--orange2:#C2521E;--ink:#2D2421;--ink2:#6f6055;--soft:#9c8b7d;
  --paper:#F7F1E6;--bg:#fff;--line:#e4d7bf;--green:#1EB87A;--blue:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
header img{height:32px}
header b{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:800;letter-spacing:-0.01em}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 72px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:0 4px 18px rgba(45,36,33,0.06)}

/* ---------- cabecera del documento ---------- */
.hero{text-align:center;padding:24px 18px 20px}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.hero h1{font-family:'Instrument Serif',serif;font-size:clamp(27px,5vw,40px);font-weight:400;line-height:1.06;margin:0 0 8px;text-wrap:pretty}
.hero h1 em{font-style:italic;color:var(--orange)}
.hero p{color:var(--ink2);font-size:15px;max-width:48ch;margin:0 auto;line-height:1.55;text-wrap:pretty}
.who{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;align-items:center}
.who-me{font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.who-me b{color:var(--ink);font-weight:700}
.who-me .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.who-more{font-size:12.5px;color:var(--soft);line-height:1.5;text-wrap:pretty;max-width:52ch}

/* ---------- tarjeta del documento ---------- */
.doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.sig-h{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:.05em;text-transform:uppercase}
.sig-sub{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5;text-wrap:pretty}
.lnk{color:var(--orange);font-size:12.5px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 2px}
.lnk:hover{text-decoration:underline}
.lnk svg{width:15px;height:15px}

.doc-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 13px;margin-bottom:10px;background:#fffdf9}
#fld-info{font-size:12.5px;color:var(--ink2);line-height:1.45;text-wrap:pretty;flex:1 1 200px}
.mini{border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-family:inherit;font-size:12.5px;font-weight:700;
  border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--blue);color:var(--blue)}

.viewer{border:1px solid var(--line);border-radius:14px;background:#efe7d8;overflow:auto;-webkit-overflow-scrolling:touch;
  scrollbar-gutter:stable;height:clamp(380px,66vh,780px);position:relative}
.pages{position:relative;padding:12px;min-width:min-content}
.pg{position:relative;margin:0 auto 14px;background:#fff;border-radius:3px;box-shadow:0 2px 12px rgba(45,36,33,.16)}
.pg:last-child{margin-bottom:0}
.pg-cv{display:block;width:100%;height:100%;border-radius:3px;opacity:0;transition:opacity .22s ease}
.pg.ready .pg-cv{opacity:1}
.ov{position:absolute;inset:0}
.box{position:absolute;border:2px dashed var(--c,#1d4ed8);border-radius:6px;background:rgba(29,78,216,.08);
  padding:0;margin:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;overflow:hidden}
.box-lbl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c,#1d4ed8);
  white-space:nowrap;pointer-events:none;line-height:1.2;padding:0 4px}
.box-num{position:absolute;top:2px;left:3px;font-size:9px;font-weight:800;color:#fff;background:var(--c,#1d4ed8);
  border-radius:999px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 4px;pointer-events:none}
.box-img{position:absolute;left:6%;top:6%;width:88%;height:88%;object-fit:contain;display:none;pointer-events:none}
.box.has-sig{background:transparent;border-style:solid;border-color:rgba(29,78,216,.28)}
.box.has-sig .box-lbl{display:none}
.box.has-sig .box-img{display:block}
.box.signed{background:transparent;border:1.5px solid rgba(29,78,216,.30);cursor:default}
.box.flash{animation:fl 1s ease-out 2}
@keyframes fl{0%,100%{box-shadow:0 0 0 0 rgba(29,78,216,0)}45%{box-shadow:0 0 0 7px rgba(29,78,216,.22)}}

#pdf-fallback{display:block;width:100%;height:clamp(360px,60vh,700px);border:1px solid var(--line);border-radius:14px;background:#fff}
.doc-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--soft);line-height:1.45}
.zoombar{display:inline-flex;gap:6px;align-items:center}
.zoombar button{width:44px;height:44px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);
  font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;line-height:1}
.zoombar button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.zoombar button:disabled{opacity:.35;cursor:default}

/* ---------- firma ---------- */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:16px;color:var(--ink);min-height:48px}
.field input:focus{outline:none;border-color:var(--orange)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.tab{padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-family:inherit;
  font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-wrap:pretty}
.tab svg{width:17px;height:17px;flex-shrink:0}
.tab[aria-selected="true"]{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.typed-prev{border:1.5px dashed var(--line);border-radius:14px;background:#fff;min-height:132px;display:flex;align-items:center;justify-content:center;padding:14px 16px;overflow:hidden}
.typed-prev b{font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(30px,9vw,54px);line-height:1.25;color:var(--blue);text-align:center;word-break:break-word}
.typed-prev.empty b{color:#c3cede}
.pad-box{background:#fff;border:2px dashed var(--blue);border-radius:14px;padding:6px;position:relative;touch-action:none}
canvas#pad{display:block;width:100%;height:210px;border-radius:10px;cursor:crosshair;background:#fff;touch-action:none}
.pad-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pad-btns{display:flex;gap:8px}
.pad-btns button{padding:0 17px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);
  background:#fff;color:var(--ink2);font-family:inherit;min-height:44px}
.pad-btns button:hover{border-color:var(--blue);color:var(--blue)}
.accept{display:flex;gap:11px;align-items:flex-start;margin:18px 0 6px;cursor:pointer;font-size:13px;color:var(--ink2);line-height:1.5;text-wrap:pretty}
.accept input{margin-top:2px;width:22px;height:22px;flex-shrink:0;accent-color:var(--orange)}
.cta{display:block;width:100%;padding:16px;border-radius:14px;border:none;background:var(--orange);color:#fff;font-family:inherit;
  font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px -8px rgba(245,130,32,.5);margin-top:10px;min-height:54px}
.cta:disabled{opacity:.45;cursor:default;box-shadow:none}
.msg{margin-top:14px;border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600;line-height:1.5}
.msg.err{background:rgba(194,82,30,.10);color:var(--orange2);border:1px solid rgba(194,82,30,.3)}
.legal{font-size:11.5px;color:var(--soft);line-height:1.5;margin-top:14px;text-align:center;text-wrap:pretty}

/* ---------- estados ---------- */
.loading{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:80px 20px;color:var(--ink2)}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.state{text-align:center;padding:40px 20px 34px}
.state .mark{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--green)}
.state .mark.warn{border-color:var(--orange2);color:var(--orange2)}
.state .mark.wait{border-color:var(--blue);color:var(--blue)}
.state .mark svg{width:29px;height:29px}
.state .mark.wait .ic-check{display:none}
.state .mark .ic-wait{display:none}
.state .mark.wait .ic-wait{display:block}
.state h2{font-family:'Instrument Serif',serif;font-size:clamp(25px,5vw,35px);font-weight:400;margin-bottom:10px}
.state h2 em{font-style:italic;color:var(--orange)}
.state p{color:var(--ink2);font-size:15px;max-width:48ch;margin:0 auto 8px;line-height:1.55;text-wrap:pretty}
.pend{font-size:12.5px;color:var(--soft);margin:6px auto 0;max-width:48ch;line-height:1.5;text-wrap:pretty}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);color:var(--ink2);padding:12px 22px;
  border-radius:999px;text-decoration:none;font-weight:700;font-size:13.5px;margin-top:16px;min-height:46px}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange)}

@media(max-width:640px){
  .wrap{padding:14px 11px 56px}
  .card{padding:17px 14px;border-radius:16px}
  .viewer{height:clamp(340px,58vh,600px)}
  .pages{padding:8px}
  .doc-top{gap:6px}
  .tabs{grid-template-columns:1fr}
  canvas#pad{height:190px}
}
</style>
</head>
<body>
<header>
  <a href="/"><img src="assets/logo-clean.webp" alt="BrightPuppy" onerror="this.style.display='none'"><b id="hdr">BrightPuppy</b></a>
</header>

<div class="wrap">

  <div id="loading" class="card loading"><div class="spin"></div><p id="loading-txt">Cargando tu documento…</p></div>

  <div id="error" class="card state" hidden>
    <div class="mark warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg></div>
    <h2 id="error-title">Algo salió mal</h2>
    <p id="error-msg"></p>
    <a class="btn-ghost" href="/" id="error-home">Ir a BrightPuppy</a>
  </div>

  <div id="app" hidden>

    <!-- estado: ya firmaste / acabas de firmar -->
    <div id="done" class="card state" hidden>
      <div class="mark" id="done-mark">
        <svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        <svg class="ic-wait" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
      </div>
      <h2 id="done-title"></h2>
      <p id="done-msg"></p>
      <div class="pend" id="done-list" hidden></div>
      <a class="btn-ghost" href="/" id="done-home">Ir a BrightPuppy</a>
    </div>

    <!-- estado: por firmar -->
    <div class="card hero" id="hero" hidden>
      <div class="eyebrow" id="eyebrow">Firma electrónica</div>
      <h1 id="hero-h1">Revisa y <em>firma</em> tu documento</h1>
      <p id="hero-p"></p>
      <div class="who" id="who"></div>
    </div>

    <!-- el documento -->
    <div class="card">
      <div class="doc-top">
        <div>
          <div class="sig-h" id="doc-h">El documento</div>
          <div class="sig-sub" id="doc-meta">—</div>
        </div>
        <a class="lnk" id="pdf-open" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18.5 14.5V18a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 18V7A1.5 1.5 0 0 1 6 5.5h3.5"/></svg><span id="pdf-open-txt">Abrir el PDF</span></a>
      </div>

      <div class="doc-bar" id="doc-bar" hidden>
        <span id="fld-info"></span>
        <button type="button" class="mini" id="next-fld" hidden>Ir a la siguiente</button>
      </div>

      <div class="viewer" id="viewer"><div class="pages" id="pages"></div></div>
      <iframe id="pdf-fallback" title="PDF" hidden></iframe>

      <div class="doc-foot">
        <span class="hint" id="pg-info"></span>
        <span class="zoombar" id="zoombar" hidden>
          <button type="button" id="zoom-out" aria-label="Reducir">&#8722;</button>
          <button type="button" id="zoom-in" aria-label="Ampliar">+</button>
        </span>
      </div>
      <div class="doc-foot"><span class="hint" id="pdf-hint"></span></div>
    </div>

    <!-- la firma -->
    <div class="card" id="sign-card" hidden>
      <div class="sig-h" id="sig-h">Tu firma</div>
      <div class="sig-sub" id="sig-sub">Escríbela o dibújala. Va en tinta azul.</div>

      <label class="field" style="margin-top:14px"><span id="name-lbl">Tu nombre completo</span><input id="name" type="text" autocomplete="name" spellcheck="false" placeholder="Nombre y apellido"></label>

      <div class="tabs" role="tablist">
        <button type="button" class="tab" id="tab-type" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V5.5h14V7"/><path d="M12 5.5V19"/><path d="M9 19h6"/></svg>
          <span id="tab-type-txt">Escribir mi nombre</span>
        </button>
        <button type="button" class="tab" id="tab-draw" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.5c3-.5 4-4.5 6.5-4.5s2 3 4 3 3.5-2.5 5.5-4"/><path d="M14.5 9.5l4-4 1.5 1.5-4 4z"/></svg>
          <span id="tab-draw-txt">Dibujar mi firma</span>
        </button>
      </div>

      <div id="pane-type">
        <div class="typed-prev empty" id="typed-prev"><b id="typed-txt">Tu nombre</b></div>
        <div class="hint" style="margin-top:10px" id="type-hint"></div>
      </div>

      <div id="pane-draw" hidden>
        <div class="pad-box"><canvas id="pad"></canvas></div>
        <div class="pad-tools">
          <span class="pad-btns">
            <button type="button" id="undo-btn">Deshacer</button>
            <button type="button" id="clear-btn">Borrar</button>
          </span>
          <span class="hint" id="draw-hint"></span>
        </div>
      </div>

      <label class="accept">
        <input type="checkbox" id="accept">
        <span id="accept-txt"></span>
      </label>

      <button class="cta" id="submit-btn" disabled>Firmar y enviar</button>
      <div id="msg"></div>
      <div class="legal" id="legal"></div>
    </div>

  </div>
</div>

<script src="firmar-doc.js?v=1787350000000"></script>
<script src="bp-cookies.js?v=1783375000000"></script>
<script src="claude-bridge.js?v=1784824000000"></script>
<script src="chat-widget.js?v=1787348000000"></script>
</body>
</html>
