<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gatos Entregados — BPuppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="styles.css">
<script src="site-publish.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root { --cat-purple:#7C5CBF; --cat-light:#F3EEFA; }
  @keyframes bpSpin { to { transform:rotate(360deg); } }
  .bp-spinner { width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--cat-purple);border-radius:50%;animation:bpSpin .8s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel">
const GE_SUPA_URL = 'https://oqqwmcplljirbreowrll.supabase.co';
const GE_SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcXdtY3BsbGppcmJyZW93cmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTY0NTQsImV4cCI6MjA5Mjg5MjQ1NH0.t-PFS9h62ag7Gmqzs8exQjV9eL1p-4V7E2syv4GPzW4';
const geSb = (() => { try { return supabase.createClient(GE_SUPA_URL, GE_SUPA_KEY); } catch(e) { return null; } })();

function GatoCaCard({ p }) {
  const ph = (Array.isArray(p.photos) && p.photos[0]) || p.photo_url || null;
  return (
    <div style={{ borderRadius:'var(--r)', overflow:'hidden', background:'var(--paper)', border:'1px solid rgba(124,92,191,0.15)', position:'relative' }}>
      <div style={{ aspectRatio:'1/1', background:'var(--cat-light)', overflow:'hidden', position:'relative' }}>
        {ph
          ? <img src={ph} alt={p.name} style={{ width:'100%', height:'100%', objectFit:'cover' }}/>
          : <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:64 }}>🐈</div>
        }
        <div style={{ position:'absolute', top:12, left:12, background:'var(--cat-purple)', color:'#fff', fontSize:10, fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase', padding:'4px 12px', borderRadius:999 }}>
          En su hogar ❤️
        </div>
      </div>
      <div style={{ padding:'16px 18px' }}>
        <div style={{ fontFamily:'var(--display)', fontSize:20, fontWeight:700, color:'var(--ink)', marginBottom:3 }}>{p.name || 'Sin nombre'}</div>
        <div style={{ fontSize:12, color:'var(--cat-purple)', fontWeight:600, marginBottom:8 }}>{p.breed}</div>
        {p.delivered_to && <div style={{ fontSize:12, color:'var(--ink-2)', marginTop:4 }}>📍 {p.delivered_to}</div>}
      </div>
    </div>
  );
}

function GatosEntregados() {
  const [cats, setCats]     = React.useState([]);
  const [status, setStatus] = React.useState('loading');

  React.useEffect(() => {
    if (!geSb) { setStatus('error'); return; }
    geSb.from('cats').select('*').eq('status', 'sold').order('updated_at', { ascending: false })
      .then(({ data, error }) => {
        if (error) { setStatus('error'); return; }
        setCats(data || []);
        setStatus('ok');
      });
  }, []);

  return (
    <div style={{ background:'var(--bg)', minHeight:'60vh' }}>
      {/* Hero */}
      <section style={{ background:'linear-gradient(135deg,#6B4FA8 0%,#4A3580 100%)', padding:'120px clamp(20px,5vw,80px) 64px', position:'relative', overflow:'hidden', color:'#fff' }}>
        <div style={{ position:'absolute', inset:0, backgroundImage:'radial-gradient(60% 70% at 80% 20%, rgba(255,255,255,0.07), transparent 60%)', pointerEvents:'none' }}/>
        <div style={{ maxWidth:800, position:'relative', zIndex:1 }}>
          <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.16em', textTransform:'uppercase', color:'rgba(255,255,255,0.6)', marginBottom:14 }}>BPuppy · Historias felinas</div>
          <h1 style={{ fontFamily:'var(--display)', fontSize:'clamp(40px,7vw,88px)', fontWeight:800, letterSpacing:'-0.04em', lineHeight:0.93, margin:'0 0 20px' }}>
            Ya en su<br/><em style={{ fontFamily:'var(--serif)', fontStyle:'italic', color:'#E8D5F0' }}>hogar.</em>
          </h1>
          <p style={{ fontSize:17, color:'rgba(255,255,255,0.75)', lineHeight:1.65, maxWidth:'48ch', margin:0 }}>
            Cada gatito que entregamos lleva nuestro cariño. Aquí celebramos a las familias que ya encontraron a su compañero felino.
          </p>
        </div>
      </section>

      {/* Grid */}
      <section style={{ padding:'clamp(48px,6vw,80px) clamp(20px,5vw,80px)' }}>
        <div style={{ maxWidth:1100, margin:'0 auto' }}>
          {status === 'loading' && (
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16, padding:'80px 0' }}>
              <div className="bp-spinner"/>
              <p style={{ color:'var(--ink-2)', fontSize:15 }}>Cargando historias…</p>
            </div>
          )}
          {status === 'ok' && cats.length === 0 && (
            <div style={{ textAlign:'center', padding:'80px 24px', color:'var(--ink-2)' }}>
              <div style={{ fontSize:56, marginBottom:16 }}>🐈</div>
              <h2 style={{ fontFamily:'var(--display)', fontSize:28, fontWeight:700, marginBottom:12 }}>Pronto habrá historias aquí</h2>
              <p style={{ fontSize:15 }}>Estamos construyendo esta sección. ¡Vuelve pronto!</p>
              <a href="Gatos.html" style={{ display:'inline-block', marginTop:24, background:'var(--cat-purple)', color:'#fff', padding:'12px 24px', borderRadius:999, fontWeight:700, textDecoration:'none' }}>Ver gatitos disponibles</a>
            </div>
          )}
          {status === 'ok' && cats.length > 0 && (
            <>
              <div style={{ marginBottom:32 }}>
                <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--cat-purple)', marginBottom:8 }}>{cats.length} gatitos entregados</div>
                <h2 style={{ fontFamily:'var(--display)', fontSize:'clamp(28px,4vw,48px)', fontWeight:700, letterSpacing:'-0.03em', color:'var(--ink)', margin:0 }}>
                  Familias que encontraron su compañero felino
                </h2>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))', gap:20 }}>
                {cats.map(p => <GatoCaCard key={p.id} p={p}/>)}
              </div>
            </>
          )}
        </div>
      </section>
    </div>
  );
}

function GatosEntregadosRoot() {
  return (
    <LangContext.Provider value={{ lang:'es', setLang:function(){} }}>
      <Header overDark={false}/>
      <main><GatosEntregados/></main>
      <Footer/>
    </LangContext.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<GatosEntregadosRoot/>);
</script>
<script src="site-animations.js"></script>
</body>
</html>
