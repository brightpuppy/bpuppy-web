<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pago PayPal — BPuppy</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="assets/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--orange:#F58220;--ink:#2D2421;--ink2:#6f6055;--paper:#F7F1E6;--line:#e4d7bf;--green:#1EB87A;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 28px;max-width:520px;width:100%;text-align:center;box-shadow:0 16px 48px rgba(45,36,33,.12)}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;margin:14px 0 8px}
h1 em{font-style:italic;color:var(--orange)}
p{color:var(--ink2);font-size:15px;line-height:1.6;margin:0 0 8px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.cta{display:inline-block;margin-top:18px;padding:13px 26px;border-radius:999px;background:var(--orange);color:#fff;text-decoration:none;font-weight:800;font-size:14px}
.ok{color:var(--green);font-weight:800;font-size:18px;margin:6px 0 14px}
.err{color:#C0392B;font-weight:700;margin:8px 0 14px}
.amt{font-family:'Bricolage Grotesque',sans-serif;font-size:38px;color:var(--orange);font-weight:800;margin:8px 0}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spin"></div>
  <h1>Procesando tu <em>pago</em>…</h1>
  <p>Confirmando con PayPal, no cierres esta ventana.</p>
</div>
<script>
(function(){
  var SUPA='https://oqqwmcplljirbreowrll.supabase.co';
  var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcXdtY3BsbGppcmJyZW93cmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTY0NTQsImV4cCI6MjA5Mjg5MjQ1NH0.t-PFS9h62ag7Gmqzs8exQjV9eL1p-4V7E2syv4GPzW4';
  var token = new URLSearchParams(location.search).get('token');
  var c = document.getElementById('card');
  function showOk(amount, type){
    var back = type==='grooming' ? '/grooming' : type==='deposit' ? '/cachorros' : '/plan';
    c.innerHTML = '<div style="font-size:42px">🎉</div><h1>¡Pago <em>recibido</em>!</h1><div class="amt">$' + Number(amount||0).toLocaleString('en-US') + '</div><p class="ok">PayPal confirmó tu pago.</p><p>Recibirás tu recibo por correo. ¡Cada vez más cerca de tu gran día! 🐾</p><a class="cta" href="' + back + '">Volver</a>';
  }
  function showErr(msg){
    c.innerHTML = '<div style="font-size:38px">⚠️</div><h1>No se pudo <em>completar</em></h1><p class="err">' + (msg||'Error inesperado.') + '</p><p>Si el cargo aparece en tu cuenta y no se reflejó aquí, escríbenos por WhatsApp y lo resolvemos al instante.</p><a class="cta" href="/plan">Reintentar</a>';
  }
  if(!token){ showErr('Falta el token de la transacción.'); return; }
  fetch(SUPA+'/functions/v1/paypal',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON},body:JSON.stringify({action:'capture',order_id:token})})
    .then(function(r){return r.json();})
    .then(function(d){ if(d.error){ showErr(d.error); return; } showOk(d.amount, d.type); })
    .catch(function(){ showErr('Error de conexión.'); });
})();
</script>
</body>
</html>
