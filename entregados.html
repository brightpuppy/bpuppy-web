<script>
/* Botón flotante: volver al catálogo cuando se abre desde un catálogo privado (?ret=1&breed=&lang=) */
(function(){
  try{
    var qp=new URLSearchParams(location.search);
    var ret=(qp.get('ret')||'').toLowerCase();
    if(ret!=='1' && ret!=='true') return;
    var EN=(qp.get('lang')||'').toLowerCase()==='en';
    var breed=(qp.get('breed')||'').trim();
    var label = EN ? ('← Back to '+(breed?breed+' ':'')+'available') : ('← Regresar a '+(breed?breed+' ':'')+'disponibles');
    var b=document.createElement('button');
    b.type='button'; b.id='bp-ret-catalog'; b.textContent=label;
    b.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:#F58220;color:#fff;border:none;border-radius:999px;padding:13px 22px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;box-shadow:0 8px 28px rgba(245,130,32,.5);max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    b.onclick=function(){
      try{ if(window.opener && !window.opener.closed){ window.opener.focus(); return; } }catch(e){}
      try{ if(history.length>1){ history.back(); } else { window.close(); } }catch(e){}
    };
    var add=function(){ if(!document.getElementById('bp-ret-catalog')) document.body.appendChild(b); };
    if(document.body) add(); else document.addEventListener('DOMContentLoaded',add);
  }catch(e){}
})();
</script>
</body>
