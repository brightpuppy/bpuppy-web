<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tienda — BPuppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="styles.css">
<script src="site-publish.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="blog-data.jsx"></script>
<script type="text/babel" src="blog-data-extra.jsx"></script>
<script type="text/babel" src="shop-data.jsx"></script>
<script type="text/babel" src="shop-views.jsx"></script>
<script type="text/babel">
const SHOP_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"lang":"es"}/*EDITMODE-END*/;
function ShopRoot() {
  const [tweaks, setTweak] = useTweaks(SHOP_TWEAK_DEFAULTS);
  const [lang, setLang] = React.useState(tweaks.lang || 'es');
  React.useEffect(() => { setLang(tweaks.lang); }, [tweaks.lang]);
  const setLangBoth = (l) => { setLang(l); setTweak('lang', l); };
  React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  const isLive = useSitePublish('Tienda');
  if (!isLive) return <ComingSoon pageName="Tienda"/>;
  return (
    <LangContext.Provider value={{ lang, setLang: setLangBoth }}>
      <Header overDark={false} />
      <main><TiendaApp /></main>
      <Footer />
    </LangContext.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ShopRoot />);
</script>
<script src="site-animations.js"></script>
</body>
</html>
