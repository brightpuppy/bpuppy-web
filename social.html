<script>
(function(){
  var PAGE = 'Social';
  var OVERLAY_ID = '__bp-cs';
  function apply() {
    var SP = window.SitePublish; if (!SP) return;
    var ov = document.getElementById(OVERLAY_ID);
    if (!SP.isPageLive(PAGE)) {
      if (!ov) {
        ov = document.createElement('div');
        ov.id = OVERLAY_ID;
        ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:Plus Jakarta Sans,sans-serif;color:#fff';
        ov.innerHTML = '<div style="font-family:Bricolage Grotesque,sans-serif;font-size:clamp(72px,14vw,130px);font-weight:800;letter-spacing:-0.04em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,0.08);line-height:1;margin-bottom:24px">Pronto</div>'
          + '<div style="font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#FF5520;margin-bottom:14px">En preparación</div>'
          + '<h1 style="font-family:Bricolage Grotesque,sans-serif;font-size:clamp(22px,3.5vw,38px);font-weight:700;letter-spacing:-0.02em;margin:0 0 14px">Social llega pronto</h1>'
          + '<p style="color:rgba(255,255,255,0.45);line-height:1.65;margin-bottom:32px;max-width:38ch;font-size:15px">Estamos preparando algo especial. Gracias por tu paciencia.</p>'
          + '<a href="/" style="display:inline-flex;align-items:center;gap:8px;background:#FF5520;color:#fff;font-weight:700;font-size:14px;padding:13px 26px;border-radius:999px;text-decoration:none">← Volver al inicio</a>';
        document.body.appendChild(ov);
      }
    } else { if (ov) ov.remove(); }
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', apply); } else { apply(); }
  window.addEventListener('bpuppy:publish', apply);
})();
</script>
<script src="site-animations.js?v=1780207679844"></script>
  <script src="bp-cookies.js?v=1780207679844"></script>
</body>
