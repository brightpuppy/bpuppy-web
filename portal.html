<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<script>try{var _bl=localStorage.getItem('bpuppy-lang');if(!_bl){_bl=(((navigator.language||navigator.userLanguage||'')+'').toLowerCase().indexOf('es')===0)?'es':'en';localStorage.setItem('bpuppy-lang',_bl);}document.documentElement.lang=_bl;}catch(e){}/*bplangboot*/</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mi portal — BPuppy</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="assets/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--orange:#F58220;--orange2:#C2521E;--ink:#2D2421;--ink2:#6f6055;--soft:#9a8c7e;--paper:#F7F1E6;--bg:#fff;--line:#e4d7bf;--green:#1EB87A;--grad:linear-gradient(135deg,#F55820 0%,#E83860 100%);--glow:0 8px 24px rgba(245,88,32,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.fade{animation:fadeIn .3s ease both}.pop{animation:pop .32s cubic-bezier(.34,1.56,.64,1) both}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
header img{height:32px}
header a{text-decoration:none;font-size:13px;font-weight:700;color:var(--ink2)}
header a:hover{color:var(--orange)}

/* ---- logged-out hero (login) ---- */
.hero{background:linear-gradient(135deg,#FFF3E6 0%,#FCE7CF 55%,#F8DCBE 100%);color:var(--ink);padding:60px 20px 58px;text-align:center;border-bottom:1px solid var(--line)}
.hero .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange2);font-weight:800}
.hero h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.05;margin:10px 0 6px;color:var(--ink)}
.hero h1 em{font-style:italic;color:var(--orange2)}
.hero p{color:var(--ink2);max-width:48ch;margin:0 auto;font-size:15px;line-height:1.6}

.wrap{max-width:1020px;margin:0 auto;padding:0 18px 70px;position:relative;z-index:2}
.login-wrap{max-width:460px;margin:34px auto 0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 14px 40px rgba(45,36,33,.10);margin-bottom:16px}

/* ---- profile header ---- */
.phead{position:relative;margin:0 -18px 0;background:var(--grad);height:128px;border-radius:0 0 26px 26px}
.phead .pat{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(circle at 20% 30%,#fff 2px,transparent 2px),radial-gradient(circle at 70% 60%,#fff 2px,transparent 2px),radial-gradient(circle at 45% 85%,#fff 1.5px,transparent 1.5px);background-size:80px 80px;border-radius:0 0 26px 26px}
.pcard{margin-top:-58px;position:relative;z-index:2}
.pcard .avatar{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;border:4px solid #fff;box-shadow:0 8px 22px rgba(45,36,33,.18)}
.pcard h1{font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:800;letter-spacing:-.02em;margin:12px 0 2px;color:var(--ink)}
.pcard .sub{font-size:13.5px;color:var(--ink2)}
.pcard .vipchip{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:5px 13px;border-radius:999px;background:rgba(245,130,32,.12);color:var(--orange2);font-size:12px;font-weight:800}
.pstats{display:flex;gap:10px;margin-top:14px}
.pstat{flex:1;background:var(--paper);border-radius:14px;padding:12px 8px;text-align:center}
.pstat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;color:var(--ink);line-height:1}
.pstat span{font-size:10.5px;color:var(--soft);font-weight:600}

/* ---- tabs ---- */
.tabs{display:flex;gap:6px;margin:18px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:10px 17px;border-radius:999px;border:none;background:#fff;border:1px solid var(--line);color:var(--ink2);font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .16s;white-space:nowrap}
.tab:hover{border-color:var(--orange);color:var(--ink)}
.tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.tab .n{background:rgba(0,0,0,.10);border-radius:999px;padding:1px 7px;font-size:11px}
.tab.on .n{background:rgba(255,255,255,.25)}
.tabpane{display:none}.tabpane.on{display:block}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start;margin-bottom:16px}
.cards-grid .card{margin-bottom:0}
.card.plan-card{transition:transform .15s ease,box-shadow .15s ease}
.card.plan-card:hover{transform:translateY(-3px);box-shadow:0 18px 46px rgba(45,36,33,.14)}

/* ---- pet cards ---- */
.pets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pet{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(45,36,33,.08);transition:transform .15s,box-shadow .15s}
.pet:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(45,36,33,.13)}
.pet .ph{height:120px;background:linear-gradient(135deg,#FFE7CE,#FCD9B8);display:grid;place-items:center;font-size:46px;position:relative}
.pet .ph img{width:100%;height:100%;object-fit:cover}
.pet .bd{padding:13px 15px 15px}
.pet .nm{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;color:var(--ink)}
.pet .br{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--orange2);background:rgba(245,130,32,.12);padding:2px 10px;border-radius:999px}
.pet .mt{font-size:12px;color:var(--soft);margin-top:6px}
.addtile{border:2px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:170px;color:var(--ink2);cursor:pointer;background:#fffdf9;font-weight:700;font-size:14px;transition:all .16s}
.addtile:hover{border-color:var(--orange);color:var(--orange);background:#fff}
.addtile .plus{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:22px}

/* ---- grooming hero card ---- */
.gbook{background:var(--grad);border-radius:20px;padding:22px 22px 24px;color:#fff;box-shadow:var(--glow);margin-bottom:16px;position:relative;overflow:hidden}
.gbook .em{position:absolute;right:-8px;top:-6px;font-size:84px;opacity:.18;transform:rotate(-12deg)}
.gbook h2{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px;position:relative}
.gbook p{font-size:13.5px;opacity:.92;max-width:42ch;line-height:1.5;position:relative}
.gbook .go{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:13px 24px;border-radius:999px;background:#fff;color:var(--orange2);font-weight:800;font-size:14.5px;text-decoration:none;position:relative;transition:transform .14s}
.gbook .go:hover{transform:translateY(-2px)}

label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 6px}
input{width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg);outline:none}
input:focus{border-color:var(--orange)}
.cta{display:block;width:100%;margin-top:14px;padding:14px;border-radius:13px;border:none;background:var(--grad);color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px -8px rgba(245,130,32,.5)}
.cta:disabled{opacity:.55;cursor:default;box-shadow:none}
.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line);box-shadow:none}
.msg{margin-top:12px;font-size:14px;font-weight:600;border-radius:12px;padding:12px 14px;line-height:1.5}
.msg.ok{background:#E3F4EC;color:#0f7a52}.msg.err{background:#f8e3df;color:#C0392B}.msg.info{background:#FCEFD9;color:var(--orange2)}
.step-label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border:none}
.row .k{color:var(--ink2);font-weight:600}.row .v{font-weight:700;text-align:right}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.b-active{background:#E3F4EC;color:var(--green)}.b-lead{background:#FCEFD9;color:var(--orange2)}.b-done{background:#E8EEF6;color:#2c5d8f}.b-cancel{background:#f3e2df;color:#C0392B}
.bar{height:8px;background:var(--paper);border-radius:999px;overflow:hidden;margin:8px 0 4px}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#FFB877)}
.center{text-align:center;padding:30px;color:var(--ink2)}
.empty{text-align:center;padding:40px 24px;color:var(--ink2)}
.empty .ico{font-size:46px;margin-bottom:12px}
.empty .t{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
.muted{font-size:12px;color:var(--soft);margin-top:8px}
.pay{display:inline-block;margin-top:8px;padding:9px 14px;background:var(--orange);color:#fff;border-radius:999px;font-size:12.5px;font-weight:800;text-decoration:none;cursor:pointer;border:none;font-family:inherit}
.b-pending{background:#FCEFD9;color:var(--orange2)}
.modal-bg{position:fixed;inset:0;background:rgba(45,36,33,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:20px;width:100%;max-width:480px;padding:24px;box-shadow:0 30px 80px rgba(45,36,33,.3)}
.modal h3{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;color:var(--ink);margin-bottom:4px}
.modal .x{float:right;border:none;background:var(--paper);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:var(--ink2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.fgrid .full{grid-column:1/-1}
.fgrid label{margin:0 0 6px}
select{width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg);outline:none}
select:focus{border-color:var(--orange)}
textarea{width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg);outline:none;resize:vertical;min-height:62px}
textarea:focus{border-color:var(--orange)}
footer{text-align:center;padding:24px;color:var(--ink2);font-size:13px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <a href="/"><img src="assets/logo-clean.webp" alt="BPuppy" onerror="this.style.display='none';this.parentNode.textContent='BPuppy'"></a>
  <a href="#" id="logout" style="display:none">Cerrar sesión</a>
</header>

<section class="hero" id="hero">
  <div class="eyebrow">BPuppy · Mi cuenta</div>
  <h1>Bienvenido a <em>tu mundo</em></h1>
  <p>Tus mascotas, citas de grooming, planes de pago y guardados — todo en un solo lugar.</p>
</section>

<div class="wrap" id="root">
  <div class="card"><div class="center"><div class="spin"></div>Cargando…</div></div>
</div>

<footer>BPuppy · ¿Dudas? WhatsApp +1 (929) 428-7300 · <a href="/" style="color:var(--orange)">Volver al sitio</a></footer>

<script>
(function(){
  var SUPA='https://oqqwmcplljirbreowrll.supabase.co';
  var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xcXdtY3BsbGppcmJyZW93cmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTY0NTQsImV4cCI6MjA5Mjg5MjQ1NH0.t-PFS9h62ag7Gmqzs8exQjV9eL1p-4V7E2syv4GPzW4';
  var sb=window.supabase.createClient(SUPA, ANON);
  var root=document.getElementById('root');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}
  function money(n){return '$'+Number(n||0).toLocaleString('en-US');}
  function fmtD(d){if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('es-US',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
  var IC={
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/>',
    paw:'<circle cx="7" cy="9" r="1.6"/><circle cx="12" cy="7.4" r="1.6"/><circle cx="17" cy="9" r="1.6"/><path d="M12 12c-2.4 0-4.3 1.9-4.3 3.9 0 1.5 1.2 2.4 2.6 2.4 .8 0 1.1-.4 1.7-.4s.9 .4 1.7 .4c1.4 0 2.6-.9 2.6-2.4 0-2-1.9-3.9-4.3-3.9z"/>',
    bath:'<path d="M4 13h16v2a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M6 13V6.5A2.5 2.5 0 0 1 8.5 4 2.5 2.5 0 0 1 11 6.5"/><path d="M6.5 19l-1 2M17.5 19l1 2"/>',
    card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
    bookmark:'<path d="M6 4h12v16l-6-4-6 4z"/>',
    scissors:'<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><path d="M20 4 8.5 15.5M8.5 8.5 20 20M7.6 7.6 12 12"/>',
    star:'<path d="M12 3l2.5 5.2 5.5 .8-4 3.9 .9 5.6L12 21l-5.4 2.5L7.5 18l-4-3.9 5.5-.8z"/>'
  };
  function svg(name,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle">'+(IC[name]||'')+'</svg>';}
  function badge(st){
    if(st==='active'||st==='scheduled'||st==='confirmed') return '<span class="badge b-active">Activo</span>';
    if(st==='lead') return '<span class="badge b-lead">Reservado</span>';
    if(st==='completed') return '<span class="badge b-done">Completado</span>';
    if(st==='cancelled'||st==='refunded') return '<span class="badge b-cancel">'+esc(st)+'</span>';
    return '<span class="badge b-lead">'+esc(st||'—')+'</span>';
  }

  function showLogin(prefMsg){
    var hero=document.getElementById('hero'); if(hero) hero.style.display='';
    root.innerHTML = '<div class="login-wrap"><div class="card"><div class="step-label">Entra a tu cuenta</div>'+
      '<p style="font-size:14px;color:var(--ink2);margin-bottom:14px">Te enviamos un <b>enlace mágico</b> a tu correo — sin contraseñas. Toca el enlace y entras automáticamente.</p>'+
      '<label>Tu correo</label><input id="le" type="email" placeholder="tu@correo.com" autocomplete="email">'+
      '<button class="cta" id="lb">Enviarme mi enlace</button>'+
      (prefMsg?('<div id="lm" class="msg '+prefMsg.k+'">'+prefMsg.t+'</div>'):'<div id="lm"></div>')+
      '<p class="muted">Usa el mismo correo con el que reservaste tu plan o tu membresía.</p></div></div>';
    document.getElementById('lb').onclick=function(){
      var em=(document.getElementById('le').value||'').trim();
      var m=document.getElementById('lm');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ m.className='msg err'; m.textContent='Escribe un correo válido.'; return; }
      var btn=document.getElementById('lb'); btn.disabled=true; btn.textContent='Enviando…';
      fetch(SUPA+'/functions/v1/portal_magiclink',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON},body:JSON.stringify({email:em, redirectTo: window.location.origin + '/portal'})})
        .then(function(r){return r.json();}).then(function(d){
          btn.disabled=false; btn.textContent='Enviarme mi enlace';
          if(d.error){ m.className='msg err'; m.textContent=d.error; return; }
          m.className='msg ok'; m.innerHTML='<span style="color:var(--green);vertical-align:middle;margin-right:4px">'+svg('mail',16)+'</span>Revisa tu correo (<b>'+esc(em)+'</b>) y toca el enlace para entrar.';
        }).catch(function(){ btn.disabled=false; btn.textContent='Enviarme mi enlace'; m.className='msg err'; m.textContent='No se pudo enviar el enlace. Intenta de nuevo.'; });
    };
  }

  function renderPlan(p, pays){
    var paid=Number(p.paid_total||0), est=Number(p.est_price||0), bal=Math.max(0,est-paid), pct=est>0?Math.min(100,Math.round(paid/est*100)):0;
    var rows=(pays||[]).filter(function(x){return x.plan_id===p.id;}).sort(function(a,b){return a.created_at<b.created_at?-1:1;});
    var html='<div class="card plan-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="step-label" style="margin:0">Plan de pagos</div>'+badge(p.status)+'</div>'+
      '<div class="row"><span class="k">Raza</span><span class="v">'+esc(p.breed||'—')+'</span></div>'+
      '<div class="row"><span class="k">Plan</span><span class="v">'+(p.months||'—')+' meses · '+money(p.monthly_amount)+'/mes</span></div>'+
      '<div class="row"><span class="k">Total estimado</span><span class="v">'+money(est)+'</span></div>'+
      '<div class="row"><span class="k">Abonado</span><span class="v" style="color:var(--green)">'+money(paid)+'</span></div>'+
      '<div class="row"><span class="k">Restante</span><span class="v">'+money(bal)+'</span></div>'+
      '<div class="row"><span class="k">Tu gran día</span><span class="v">'+esc(fmtD(p.target_date))+'</span></div>'+
      '<div class="bar"><span style="width:'+pct+'%"></span></div><div style="font-size:11px;color:var(--ink2);text-align:right">'+pct+'% completado</div>';
    if(bal>0 && p.status!=='cancelled'){
      html+='<button class="pay" data-plan="'+esc(p.id)+'" data-amt="monthly">Hacer abono ('+money(p.monthly_amount)+')</button> '+
            '<button class="pay" style="background:var(--ink2)" data-plan="'+esc(p.id)+'" data-amt="all">Pagar restante ('+money(bal)+')</button>';
    }
    if(rows.length){
      html+='<div style="margin-top:14px"><div class="step-label">Tus abonos</div>'+rows.map(function(x){return '<div class="row"><span class="k">'+esc(fmtD((x.created_at||'').slice(0,10)))+'</span><span class="v">'+money(x.amount)+' · '+esc(x.method||'')+'</span></div>';}).join('')+'</div>';
    }
    html+='</div>';
    return html;
  }

  function petEmoji(breed){
    return '<span style="color:var(--orange)">'+svg('paw',44)+'</span>';
  }
  function renderPetCard(p){
    var pending = p.status==='pending';
    var age = p.birthdate ? fmtD(p.birthdate) : '';
    var meta=[p.sex, age, (p.weight_lbs?(p.weight_lbs+' lb'):'')].filter(Boolean).map(esc).join(' · ');
    var ph = p.photo_url
      ? '<img src="'+esc(p.photo_url)+'" alt="">'
      : petEmoji(p.breed);
    var action = pending
      ? '<span class="badge b-pending" style="display:inline-block;margin-top:11px">Pendiente de confirmar</span>'
      : '<a href="/grooming.html" class="pay" style="margin-top:11px;background:var(--paper);color:var(--orange2)">Agendar para '+esc((p.name||'').split(' ')[0]||'mi mascota')+'</a>';
    return '<div class="pet pop"'+(pending?' style="opacity:.82"':'')+'><div class="ph">'+ph+'</div><div class="bd">'+
      '<div class="nm">'+esc(p.name||'Mi mascota')+'</div>'+
      (p.breed?('<span class="br">'+esc(p.breed)+(p.size?(' · '+esc(p.size)):'')+'</span>'):'')+
      (meta?('<div class="mt">'+meta+'</div>'):'')+
      action+
      '</div></div>';
  }
  function renderPetsTab(pets){
    var cards=(pets||[]).map(renderPetCard).join('');
    cards+='<div class="addtile js-add-pet"><div class="plus">+</div>Agregar otra mascota</div>';
    if(!(pets&&pets.length)){
      return '<div class="card"><div class="empty"><div class="ico" style="color:var(--orange)">'+svg('paw',40)+'</div><div class="t">Aún no tienes mascotas registradas</div><div>Registra a tu mascota y nuestro equipo la confirma.</div><br><button class="pay js-add-pet" style="text-decoration:none">Agregar mi mascota</button></div></div>';
    }
    return '<div class="pets-grid">'+cards+'</div>';
  }
  function openPetModal(){
    var bg=document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML='<div class="modal pop">'+
      '<button class="x" id="pmx">×</button>'+
      '<h3>Agregar mascota</h3>'+
      '<p style="font-size:13px;color:var(--ink2)">La registramos y nuestro equipo la confirma. Te avisamos cuando esté lista para agendar.</p>'+
      '<div class="fgrid">'+
        '<div class="full"><label>Nombre *</label><input id="pf_name" placeholder="Ej: Max"></div>'+
        '<div><label>Raza</label><input id="pf_breed" placeholder="Ej: Poodle"></div>'+
        '<div><label>Tamaño</label><select id="pf_size"><option value="">—</option><option>Pequeño</option><option>Mediano</option><option>Grande</option><option>XL</option></select></div>'+
        '<div><label>Sexo</label><select id="pf_sex"><option value="">—</option><option>Macho</option><option>Hembra</option></select></div>'+
        '<div><label>Peso (lb)</label><input id="pf_weight" type="number" min="0" placeholder="Ej: 12"></div>'+
        '<div><label>Pelaje</label><input id="pf_coat" placeholder="Ej: Rizado"></div>'+
        '<div><label>Nacimiento</label><input id="pf_birth" type="date"></div>'+
        '<div class="full"><label>Notas</label><textarea id="pf_notes" placeholder="Alergias, comportamiento, preferencias..."></textarea></div>'+
      '</div>'+
      '<button class="cta" id="pf_save">Guardar mascota</button>'+
      '<div id="pf_msg"></div>'+
    '</div>';
    document.body.appendChild(bg);
    function close(){ bg.remove(); }
    bg.querySelector('#pmx').onclick=close;
    bg.onclick=function(e){ if(e.target===bg) close(); };
    bg.querySelector('#pf_save').onclick=function(){
      var name=(bg.querySelector('#pf_name').value||'').trim();
      var m=bg.querySelector('#pf_msg');
      if(!name){ m.className='msg err'; m.textContent='El nombre es obligatorio.'; return; }
      var payload={ name:name, breed:(bg.querySelector('#pf_breed').value||'').trim(), size:bg.querySelector('#pf_size').value, sex:bg.querySelector('#pf_sex').value, coat:(bg.querySelector('#pf_coat').value||'').trim(), weight_lbs:bg.querySelector('#pf_weight').value, birthdate:bg.querySelector('#pf_birth').value, notes:(bg.querySelector('#pf_notes').value||'').trim() };
      var btn=bg.querySelector('#pf_save'); btn.disabled=true; btn.textContent='Guardando…';
      sb.auth.getSession().then(function(s){
        var tok=s.data&&s.data.session&&s.data.session.access_token;
        if(!tok){ m.className='msg err'; m.textContent='Sesión expirada. Vuelve a entrar.'; btn.disabled=false; btn.textContent='Guardar mascota'; return; }
        fetch(SUPA+'/functions/v1/portal_add_pet',{method:'POST',headers:{'Authorization':'Bearer '+tok,'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify(payload)})
          .then(function(r){return r.json();}).then(function(d){
            if(d.error){ m.className='msg err'; m.textContent=d.error; btn.disabled=false; btn.textContent='Guardar mascota'; return; }
            m.className='msg ok'; m.textContent='¡Listo! '+esc(name)+' quedó registrada. Te avisamos al confirmarla.';
            btn.textContent='Guardada';
            setTimeout(function(){ close(); showDashboard(); }, 1500);
          }).catch(function(){ m.className='msg err'; m.textContent='No se pudo guardar. Intenta de nuevo.'; btn.disabled=false; btn.textContent='Guardar mascota'; });
      });
    };
  }

  function renderMembership(m){
    return '<div class="card plan-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="step-label" style="margin:0">Membresía</div>'+badge(m.status)+'</div>'+
      '<div class="row"><span class="k">Plan</span><span class="v">'+esc(m.plan||'—')+' ('+esc(m.billing||'—')+')</span></div>'+
      '<div class="row"><span class="k">Mascota</span><span class="v">'+esc(m.pet_name||'—')+(m.pet_size?(' · '+esc(m.pet_size)):'')+'</span></div>'+
      '<div class="row"><span class="k">Baños disponibles</span><span class="v" style="color:var(--orange2);font-size:18px">'+(m.credits_balance||0)+'</span></div>'+
      '<div class="row"><span class="k">Próxima renovación</span><span class="v">'+esc(fmtD(m.renew_date))+'</span></div>'+
      '</div>';
  }

  function initials(d){
    var f=(d.client&&d.client.first_name)||'', l=(d.client&&d.client.last_name)||'';
    var s=((f[0]||'')+(l[0]||'')).toUpperCase();
    if(s) return s;
    return (d.email||'?').slice(0,2).toUpperCase();
  }
  function renderGroomingTab(d){
    var ms=d.memberships||[];
    var html='<div class="gbook"><div class="em" style="color:#fff">'+svg('scissors',84)+'</div>'+
      '<h2>Agenda tu próxima cita</h2>'+
      '<p>Reserva baño, corte o spa para tu mascota en segundos. '+(ms.length?'Tus baños de membresía se aplican automáticamente.':'Elige el servicio y la fecha que más te convenga.')+'</p>'+
      '<a href="/grooming.html" class="go">Agendar grooming →</a></div>';
    if(ms.length){
      var cards=ms.map(renderMembership).join('');
      html+='<div class="cards-grid">'+cards+'</div>';
    } else {
      html+='<div class="card"><div class="empty"><div class="ico" style="color:var(--orange)">'+svg('bath',40)+'</div><div class="t">Aún no tienes membresía de grooming</div><div>Con una membresía ahorras en cada baño y recibes beneficios VIP. Mira los planes al reservar.</div></div></div>';
    }
    return html;
  }
  function renderPagosTab(d){
    var cards='';
    if(d.plans && d.plans.length){ d.plans.forEach(function(p){ cards+=renderPlan(p, d.payments); }); }
    if(cards) return '<div class="cards-grid">'+cards+'</div>';
    return '<div class="card"><div class="empty"><div class="ico" style="color:var(--orange)">'+svg('card',40)+'</div><div class="t">No tienes planes de pago activos</div><div>¿Buscas un cachorro? Arma un plan de pagos a tu medida.</div><br><a href="/plan" class="pay" style="text-decoration:none">Armar mi plan</a></div></div>';
  }
  function renderGuardadosTab(){
    return '<div class="card"><div class="empty"><div class="ico" style="color:var(--orange)">'+svg('bookmark',40)+'</div><div class="t">Tus guardados llegan pronto</div><div>Aquí podrás guardar tus razas favoritas y artículos del blog para verlos después.</div></div></div>';
  }
  function renderCuentaTab(d){
    var petNm=(d.pets&&d.pets[0]&&(d.pets[0].name||d.pets[0].pet_name))||'';
    var petReason=petNm?('Mi mascota ('+esc(petNm)+') ya no está con nosotros'):'Mi mascota ya no está con nosotros';
    if(d.email_opted_out){
      return '<div class="card"><div class="empty"><div class="ico" style="color:var(--orange)">'+svg('mail',40)+'</div>'+
        '<div class="t">Correos detenidos</div>'+
        '<div>Ahora mismo no te enviamos correos automáticos. Puedes reactivarlos cuando quieras.</div><br>'+
        '<button class="go" id="pf-resume" style="border:none;cursor:pointer">Reactivar mis correos</button></div></div>';
    }
    return '<div class="card"><div class="empty" style="text-align:left"><div class="ico" style="color:var(--orange)">'+svg('mail',40)+'</div>'+
      '<div class="t">Correos y notificaciones</div>'+
      '<div style="margin-bottom:14px">Si ya no quieres recibir nuestros correos (novedades, recordatorios, cumpleaños de tu mascota), puedes detenerlos aquí. Cuéntanos por qué, así mejoramos.</div>'+
      '<label style="display:block;font-size:12px;font-weight:700;color:#6b5a4e;margin-bottom:6px">Motivo</label>'+
      '<select id="pf-reason" style="width:100%;padding:11px 12px;border:1px solid #e5d9cc;border-radius:12px;font-size:14px;margin-bottom:14px;background:#fff">'+
        '<option value="Demasiados correos">Recibo demasiados correos</option>'+
        '<option value="No me interesa el contenido">El contenido no me interesa</option>'+
        '<option value="Nunca me suscribí">Nunca me suscribí</option>'+
        '<option value="'+petReason.replace(/"/g,'&quot;')+'">'+petReason+'</option>'+
        '<option value="Otro">Otro motivo</option>'+
      '</select>'+
      '<button id="pf-stop" style="background:#dc2626;border:none;cursor:pointer;color:#fff;width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:14px">Detener mis correos</button></div></div>';
  }

  function showDashboard(email){
    document.getElementById('logout').style.display='inline';
    var hero=document.getElementById('hero'); if(hero) hero.style.display='none';
    root.innerHTML='<div class="card"><div class="center"><div class="spin"></div>Cargando tu portal…</div></div>';
    sb.auth.getSession().then(function(s){
      var tok = s.data && s.data.session && s.data.session.access_token;
      if(!tok){ showLogin({k:'err',t:'Sesión expirada, vuelve a entrar.'}); return; }
      fetch(SUPA+'/functions/v1/portal_data',{method:'POST',headers:{'Authorization':'Bearer '+tok,'apikey':ANON,'Content-Type':'application/json'},body:'{}'})
        .then(function(r){return r.json();}).then(function(d){
          if(d.error){ root.innerHTML='<div class="card"><div class="msg err">'+esc(d.error)+'</div></div>'; return; }
          var emailName = (d.email||'').split('@')[0].replace(/[._]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
          var name = (d.client && d.client.first_name) ? (d.client.first_name+(d.client.last_name?(' '+d.client.last_name):'')) : (emailName||d.email);
          var loc = d.client ? [d.client.city,d.client.state].filter(Boolean).join(', ') : '';
          var nPets=(d.pets||[]).length, nMs=(d.memberships||[]).length, baths=(d.memberships||[]).reduce(function(a,m){return a+(m.credits_balance||0);},0);
          var vip=(d.memberships||[]).some(function(m){return /vip|total/i.test(m.plan||'');});

          var head='<div class="phead"><div class="pat"></div></div>'+
            '<div class="pcard fade"><div class="avatar">'+esc(initials(d))+'</div>'+
            '<h1>Hola, '+esc((name||'').split(' ')[0]||name)+'</h1>'+
            '<div class="sub">'+esc(d.email)+(loc?(' · '+esc(loc)):'')+'</div>'+
            (vip?'<div class="vipchip">'+svg('star',13)+' Cliente VIP</div>':'')+
            '<div class="pstats">'+
              '<div class="pstat"><b>'+nPets+'</b><span>'+(nPets===1?'mascota':'mascotas')+'</span></div>'+
              '<div class="pstat"><b>'+baths+'</b><span>baños disp.</span></div>'+
              '<div class="pstat"><b>'+nMs+'</b><span>'+(nMs===1?'membresía':'membresías')+'</span></div>'+
            '</div></div>';

          var tabs='<div class="tabs">'+
            '<button class="tab on" data-t="mascotas">'+svg('paw',16)+' Mascotas'+(nPets?'<span class="n">'+nPets+'</span>':'')+'</button>'+
            '<button class="tab" data-t="grooming">'+svg('scissors',16)+' Grooming</button>'+
            '<button class="tab" data-t="pagos">'+svg('card',16)+' Pagos'+((d.plans||[]).length?'<span class="n">'+d.plans.length+'</span>':'')+'</button>'+
            '<button class="tab" data-t="guardados">'+svg('bookmark',16)+' Guardados</button>'+
            '<button class="tab" data-t="cuenta">'+svg('mail',16)+' Cuenta</button>'+
          '</div>';

          var panes='<div class="tabpane on" data-p="mascotas">'+renderPetsTab(d.pets)+'</div>'+
            '<div class="tabpane" data-p="grooming">'+renderGroomingTab(d)+'</div>'+
            '<div class="tabpane" data-p="pagos">'+renderPagosTab(d)+'</div>'+
            '<div class="tabpane" data-p="guardados">'+renderGuardadosTab()+'</div>'+
            '<div class="tabpane" data-p="cuenta">'+renderCuentaTab(d)+'</div>';

          root.innerHTML=head+tabs+panes;

          // tab switching
          root.querySelectorAll('.tab').forEach(function(btn){
            btn.onclick=function(){
              var t=btn.getAttribute('data-t');
              root.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b===btn);});
              root.querySelectorAll('.tabpane').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-p')===t);});
            };
          });
          // wire create-pet buttons
          root.querySelectorAll('.js-add-pet').forEach(function(b){ b.onclick=function(e){ e.preventDefault(); openPetModal(); }; });
          // wire correos (detener / reactivar) — pestaña Cuenta
          function pfEmail(action, reason, btn){
            if(btn){ btn.disabled=true; btn.dataset.txt=btn.textContent; btn.textContent='Guardando…'; }
            sb.auth.getSession().then(function(s){
              var tok=s.data&&s.data.session&&s.data.session.access_token;
              if(!tok){ showLogin({k:'err',t:'Sesión expirada, vuelve a entrar.'}); return; }
              fetch(SUPA+'/functions/v1/portal_data',{method:'POST',headers:{'Authorization':'Bearer '+tok,'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify({action:action,reason:reason})})
                .then(function(r){return r.json();}).then(function(x){ if(x&&x.ok){ showDashboard(d.email); } else { if(btn){btn.disabled=false;btn.textContent=btn.dataset.txt;} alert((x&&x.error)||'No se pudo, intenta de nuevo.'); } })
                .catch(function(){ if(btn){btn.disabled=false;btn.textContent=btn.dataset.txt;} alert('No se pudo, intenta de nuevo.'); });
            });
          }
          var pfStop=root.querySelector('#pf-stop');
          if(pfStop) pfStop.onclick=function(){ var rs=(root.querySelector('#pf-reason')||{}).value||''; if(!confirm('¿Detener todos los correos automáticos?')) return; pfEmail('stop_emails', rs, pfStop); };
          var pfResume=root.querySelector('#pf-resume');
          if(pfResume) pfResume.onclick=function(){ pfEmail('resume_emails', '', pfResume); };
          // wire pay buttons (plan abonos)
          root.querySelectorAll('button.pay[data-plan]').forEach(function(btn){
            btn.onclick=function(){ var pid=btn.getAttribute('data-plan'); var t=btn; t.disabled=true; t.textContent='Redirigiendo...';
              fetch(SUPA+'/functions/v1/stripe_checkout',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON},body:JSON.stringify({type:'plan_abono',plan_id:pid,success_url:window.location.origin+'/portal',cancel_url:window.location.origin+'/portal'})})
                .then(function(r){return r.json();}).then(function(c){ if(c.url){window.location.href=c.url;} else { t.disabled=false; t.textContent='Reintentar'; alert(c.error||'Error'); } });
            };
          });
        }).catch(function(){ root.innerHTML='<div class="card"><div class="msg err">No pudimos cargar tu portal. Intenta de nuevo.</div></div>'; });
    });
  }

  document.getElementById('logout').onclick=function(e){ e.preventDefault(); sb.auth.signOut().then(function(){ showLogin({k:'info',t:'Sesión cerrada.'}); document.getElementById('logout').style.display='none'; }); };

  // arranque
  sb.auth.getSession().then(function(s){
    if(s.data && s.data.session && s.data.session.user){ showDashboard(s.data.session.user.email); }
    else { showLogin(null); }
  });
  // capturar el hash del magic link al volver (#access_token=...)
  sb.auth.onAuthStateChange(function(_evt, session){ if(session && session.user){ showDashboard(session.user.email); } });
})();
</script>
