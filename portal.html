<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mi perfil — BPuppy</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="assets/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --orange:#F58220;--orange2:#C2521E;--ink:#241C18;--ink2:#6b5c50;--soft:#9d8e80;
  --paper:#FBF7F0;--bg:#fff;--line:#EADFCE;--line2:#F2E9DA;
  --green:#12A47A;--violet:#7C3AED;--blue:#2563EB;
  --r:20px;--rs:14px;
  --shadow:0 1px 2px rgba(36,28,24,.04), 0 8px 28px -14px rgba(36,28,24,.16);
  --shadow-lift:0 2px 6px rgba(36,28,24,.06), 0 18px 44px -18px rgba(36,28,24,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}

/* ── animaciones ── */
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
@keyframes popout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes hue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes slide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.rise{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
.rise:nth-child(2){animation-delay:.05s}.rise:nth-child(3){animation-delay:.1s}.rise:nth-child(4){animation-delay:.15s}

/* ── header ── */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 18px;background:rgba(251,247,240,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
header .brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:15px;letter-spacing:-.01em}
header .brand img{height:28px}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);text-decoration:none;cursor:pointer;
  transition:border-color .16s,color .16s,transform .16s}
.hbtn:hover{border-color:var(--orange);color:var(--orange2);transform:translateY(-1px)}
.hbtn.ghost{border-style:dashed}

.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}

/* ── avatar (sin foto de portada) ── */
/* Banda de color suave arriba, solo para dar aire. El avatar YA no se recorta:
   la tarjeta deja de tener overflow:hidden y el avatar cabe completo dentro. */
.topband{height:96px;border-radius:0 0 26px 26px;background:
  linear-gradient(135deg,#FFE9D2,#FFD9E4 45%,#E4E7FF);border:1px solid var(--line);border-top:none}
.camchip{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(36,28,24,.5);
  color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);transition:background .16s}
.camchip:hover{background:rgba(36,28,24,.72)}

.idcard{position:relative;margin:-34px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:0 24px 22px;box-shadow:var(--shadow)}
.idcard .rainbow{height:3px;margin:0 -24px 0;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,#F55820,#E83860,#7C3AED,#2563EB,#12A47A,#F5A623,#F55820);
  background-size:200% 100%;animation:slide 9s linear infinite}
.av{position:relative;width:96px;height:96px;margin:-44px 0 0;border-radius:50%;border:4px solid var(--bg);
  background:linear-gradient(135deg,#F55820,#E83860);display:grid;place-items:center;color:#fff;
  font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:800;box-shadow:0 8px 22px -8px rgba(36,28,24,.4)}
/* La imagen se recorta redonda, pero el botón de cámara (.pen) queda FUERA y visible. */
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av .pen{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--bg);
  background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .16s}
.av .pen:hover{transform:scale(1.12)}
h1.nm{font-family:'Bricolage Grotesque',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.02em;margin:14px 0 3px;line-height:1.1}
.sub{font-size:13.5px;color:var(--ink2)}
.memchip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:800;
  border:1.5px solid;background:var(--bg);margin-top:10px}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
.stat{border:1px solid var(--line);border-radius:var(--rs);padding:13px 10px;text-align:center;background:var(--bg);
  transition:border-color .16s,transform .16s}
.stat:hover{border-color:var(--orange);transform:translateY(-2px)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:23px;font-weight:800;line-height:1}
.stat span{display:block;font-size:10.5px;color:var(--soft);font-weight:700;margin-top:4px;letter-spacing:.01em}

/* ── insignias ── */
.bgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.bdg{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);font-size:12px;font-weight:700;cursor:default;transition:transform .16s,border-color .16s}
.bdg:hover{transform:translateY(-2px);border-color:var(--orange)}
.bdg .em{font-size:15px;line-height:1}
.bdg.lock{opacity:.5;border-style:dashed;color:var(--soft);filter:grayscale(1)}
.bdg.lock:hover{opacity:.85;filter:none}

/* ── tabs (outline, sin relleno) ── */
.tabs{display:flex;gap:8px;margin:22px 0 18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink2);font-family:inherit;font-size:13.5px;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:all .16s}
.tab:hover{border-color:var(--orange);color:var(--ink)}
.tab.on{border-color:var(--orange);color:var(--orange2);box-shadow:inset 0 0 0 1px var(--orange)}
.tab .n{background:var(--paper);border-radius:999px;padding:1px 7px;font-size:11px;color:var(--ink2)}
.pane{display:none}.pane.on{display:block;animation:fade .25s ease both}

/* ── tarjetas ── */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tint{border-left:3px solid var(--orange)}
.ttl{font-family:'Bricolage Grotesque',sans-serif;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.lb{font-size:10.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:13.5px}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink2)}.row .v{font-weight:700;text-align:right}
.muted{font-size:12.5px;color:var(--ink2);line-height:1.65}

/* ── mascotas ── */
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}
.pet{background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s}
.pet:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--orange)}
.pet .ph{height:132px;background:linear-gradient(135deg,#FFEEDC,#FFE1EA);display:grid;place-items:center;position:relative;overflow:hidden}
.pet .ph img{width:100%;height:100%;object-fit:cover}
.pet .bd{padding:12px 14px 14px}
.pet .nm2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800}
.pet .br{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--orange2);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.pet .mt{font-size:11.5px;color:var(--soft);margin-top:6px}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.tag.warn{background:#FFF4E0;color:#8A5A00;border:1px solid #F2D9A6}
.tag.ok{background:#E6F7F1;color:#0B6B4F;border:1px solid #B8E6D5}
.addtile{border:1.5px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;min-height:190px;color:var(--ink2);cursor:pointer;background:transparent;
  font-weight:700;font-size:13.5px;transition:all .18s}
.addtile:hover{border-color:var(--orange);color:var(--orange2);background:var(--bg)}
.addtile .plus{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:21px}

/* ── botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;font-weight:800;
  cursor:pointer;text-decoration:none;transition:all .16s}
.btn:hover{border-color:var(--orange);color:var(--orange2);transform:translateY(-2px)}
.btn.pri{border-color:transparent;background:linear-gradient(135deg,#F55820,#E83860);color:#fff;box-shadow:0 10px 24px -12px rgba(245,88,32,.9)}
.btn.pri:hover{color:#fff;filter:brightness(1.06)}
.btn.w{width:100%}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:11px}

/* ── descubre ── */
.disc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.dl{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:var(--rs);
  background:var(--bg);text-decoration:none;transition:all .18s}
.dl:hover{border-color:var(--orange);transform:translateX(4px)}
.dl .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:18px;border:1px solid var(--line)}
.dl .t{font-weight:800;font-size:13.5px}
.dl .d{font-size:11.5px;color:var(--soft);margin-top:1px;line-height:1.4}

/* ── formularios / modales ── */
label{display:block;font-size:10.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:inherit;
  font-size:15px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .16s}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
textarea{min-height:88px;resize:vertical;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;z-index:120;background:rgba(36,28,24,.55);backdrop-filter:blur(4px);display:flex;
  align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;animation:fade .16s ease both}
.ov.out{animation:fade .14s ease reverse both}
.modal{background:var(--bg);border-radius:24px;max-width:520px;width:100%;padding:24px;box-shadow:0 30px 80px -20px rgba(36,28,24,.6);
  animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
.ov.out .modal{animation:popout .14s ease both}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.x{border:none;background:var(--paper);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--ink2);transition:transform .14s}
.x:hover{transform:rotate(90deg);background:#FDE7E7;color:#B4232A}
.msg{border-radius:12px;padding:11px 14px;font-size:13.5px;margin-top:12px;line-height:1.5}
.msg.err{background:#FDECEC;color:#9B1C1C;border:1px solid #F5C2C2}
.msg.ok{background:#E6F7F1;color:#0B6B4F;border:1px solid #B8E6D5}
.msg.info{background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE}
.nudge{border:1px dashed var(--orange);background:#FFF8F1;border-radius:var(--rs);padding:12px 15px;font-size:13px;
  color:var(--orange2);margin-top:14px;line-height:1.55}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto 12px}
.center{text-align:center;padding:34px 10px;color:var(--ink2)}
.empty{text-align:center;padding:30px 16px}
.empty .ic{font-size:34px;opacity:.5;margin-bottom:8px}
.empty .t{font-weight:800;font-size:15px;margin-bottom:4px}
.empty .d{font-size:13px;color:var(--ink2);line-height:1.6}
.bar{height:7px;background:var(--paper);border-radius:999px;overflow:hidden;margin:10px 0 5px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#F55820,#E83860);border-radius:999px}
.bk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--rs);margin-bottom:9px;transition:border-color .16s}
.bk:hover{border-color:var(--orange)}
.cardpm{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:var(--rs);background:var(--paper)}
.cardpm .chip{width:46px;height:31px;border-radius:6px;background:linear-gradient(135deg,#241C18,#4a3b31);color:#fff;
  display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em}

/* ── login ── */
.login{max-width:430px;margin:56px auto 0}
.hero{text-align:center;padding:44px 20px 10px}
.hero .eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange2);font-weight:800}
.hero h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,6vw,50px);line-height:1.05;margin:10px 0 8px}
.hero h1 em{font-style:italic;color:var(--orange2)}
.hero p{color:var(--ink2);max-width:44ch;margin:0 auto;font-size:15px;line-height:1.6}

footer{text-align:center;padding:28px 16px 40px;font-size:12.5px;color:var(--soft);line-height:1.7}
footer a{color:var(--orange2);text-decoration:none;font-weight:700}

@media(max-width:640px){
  .wrap{padding:0 12px 70px}
  .topband{height:78px;border-radius:0 0 20px 20px}
  .idcard{padding:0 17px 18px;border-radius:18px}
  .idcard .rainbow{margin:0 -17px}
  .av{width:80px;height:80px;margin-top:-38px;font-size:27px}
  h1.nm{font-size:23px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .modal{padding:19px;border-radius:19px}
}
</style>
</head>

  /* ═══ subir foto ═══ */
  function pickPhoto(cb){
    var inp=document.getElementById('upfile');
    inp.value='';
    inp.onchange=async function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      if(f.size>8*1024*1024){ alert(PT('La foto es muy grande (máx. 8 MB).','That photo is too big (8 MB max).')); return; }
      try{
        var ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
        var path=(D&&D.client&&D.client.id?D.client.id:'anon')+'/'+Date.now()+'.'+ext;
        var up=await sb.storage.from('portal-photos').upload(path,f,{upsert:true,contentType:f.type||'image/jpeg'});
        if(up.error) throw up.error;
        var pub=sb.storage.from('portal-photos').getPublicUrl(path);
        cb(pub.data.publicUrl);
      }catch(e){ alert(PT('No se pudo subir la foto.','We could not upload the photo.')); }
    };
    inp.click();
  }
  async function api(body){
    var s=await sb.auth.getSession();
    var tok=s.data&&s.data.session&&s.data.session.access_token;
    if(!tok) return {error:'no_auth'};
    var r=await fetch(SUPA+'/functions/v1/portal_data',{method:'POST',headers:{'Authorization':'Bearer '+tok,'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    return await r.json();
  }

  /* ═══ plan: color, nombre y lo que incluye ═══ */
  function planInfo(plan){
    var s=String(plan||'').toLowerCase();
    var billing=(s.indexOf('year')>=0||s.indexOf('anual')>=0||s.indexOf('annual')>=0)?PT('anual','yearly'):PT('mensual','monthly');
    if(s.indexOf('vip')>=0) return {label:'VIP',color:'#7C3AED',soft:'#F4EDFF',billing:billing,perks:[
      PT('Spa VIP completo cada mes','Full VIP spa every month'),
      PT('Pickup & delivery ilimitado','Unlimited pickup & delivery'),
      PT('20% de descuento en servicios extra','20% off extra services'),
      PT('Agenda reservada siempre para ti','Priority slots always held for you'),
      PT('Reporte de pelaje y regalo de cumpleaños','Coat report and birthday gift')]};
    if(s.indexOf('total')>=0) return {label:'Total',color:'#C2521E',soft:'#FFF2E6',billing:billing,perks:[
      PT('1 baño + corte al mes','1 bath + haircut per month'),
      PT('Uñas y oídos incluidos','Nails and ears included'),
      PT('Pickup & delivery incluido (10 millas)','Pickup & delivery included (10 miles)'),
      PT('15% de descuento en servicios extra','15% off extra services'),
      PT('Prioridad en agenda y foto mensual','Priority booking and a monthly photo')]};
    return {label:'Esencial',color:'#12A47A',soft:'#E7F7F1',billing:billing,perks:[
      PT('1 baño completo al mes','1 full bath per month'),
      PT('Uñas incluidas','Nails included'),
      PT('10% de descuento en servicios extra','10% off extra services'),
      PT('Recordatorios automáticos de tu cita','Automatic appointment reminders')]};
  }
  function topPlan(ms){
    var order={VIP:3,Total:2,Esencial:1}, best=null;
    (ms||[]).forEach(function(m){ if(String(m.status||'active')==='cancelled') return;
      var i=planInfo(m.plan); if(!best||order[i.label]>order[best.label]) best=i; });
    return best;
  }

  /* ═══ REPROGRAMAR — conectado al CRM: calendario de días + horas disponibles (bloques de 2h) ═══ */
  var GROOM_CALL='808-492-8294'; // línea para "agendar hoy" (misma que el negocio)
  function slotMin(t){ var m=String(t).match(/(\d+):(\d+)\s*(AM|PM)/i); if(!m) return 0; var h=(+m[1])%12; if(/pm/i.test(m[3])) h+=12; return h*60+(+m[2]); }
  function ymdLocal(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  window.reschedule=function(id,d0,t0){
    var st={ slots:['9:00 AM','11:00 AM','1:00 PM','3:00 PM','5:00 PM'], closed:[0], cap:1, day:'', time:'' };
    var ov=modal(PT('Reprogramar cita','Reschedule'),
      '<p class="muted">'+PT('Elige un día y una hora disponibles. Cada cita ocupa un bloque de 2 horas.','Pick an available day and time. Each appointment takes a 2-hour block.')+'</p>'+
      '<div style="font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">'+PT('Día','Day')+'</div>'+
      '<div id="rs-days" style="display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch"></div>'+
      '<div id="rs-slotwrap" style="margin-top:12px;display:none"><div style="font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">'+PT('Hora','Time')+'</div><div id="rs-slots" style="display:flex;gap:7px;flex-wrap:wrap"></div></div>'+
      '<div id="rs-note" style="font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.5"></div>'+
      '<button class="btn pri w" id="rs-go" style="margin-top:14px" disabled>'+PT('Solicitar cambio','Request change')+'</button><div id="rs-msg"></div>', 500);
    var daysEl=ov.querySelector('#rs-days'), slotsEl=ov.querySelector('#rs-slots'), slotWrap=ov.querySelector('#rs-slotwrap'), noteEl=ov.querySelector('#rs-note'), goBtn=ov.querySelector('#rs-go');
    function renderDays(){
      var today=new Date(); today.setHours(0,0,0,0);
      var html=''; var n=0, i=0;
      while(n<14 && i<40){
        var dt=new Date(today.getTime()+i*864e5); i++;
        if(st.closed.indexOf(dt.getDay())>=0) continue;
        var ds=ymdLocal(dt);
        var wd=[PT('Dom','Sun'),PT('Lun','Mon'),PT('Mar','Tue'),PT('Mié','Wed'),PT('Jue','Thu'),PT('Vie','Fri'),PT('Sáb','Sat')][dt.getDay()];
        var lbl=(i===1?PT('Hoy','Today'):wd);
        html+='<button type="button" class="rs-day" data-d="'+ds+'" style="flex:0 0 auto;min-width:56px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;font-family:inherit"><div style="font-size:10.5px;color:var(--ink2);font-weight:700">'+lbl+'</div><div style="font-size:17px;font-weight:800;color:var(--ink)">'+dt.getDate()+'</div></button>';
        n++;
      }
      daysEl.innerHTML=html;
      Array.prototype.forEach.call(daysEl.querySelectorAll('.rs-day'), function(b){ b.onclick=function(){ pickDay(b.getAttribute('data-d'), b); }; });
    }
    function pickDay(ds, btn){
      st.day=ds; st.time=''; goBtn.disabled=true;
      Array.prototype.forEach.call(daysEl.querySelectorAll('.rs-day'), function(b){ var on=b===btn; b.style.borderColor=on?'var(--orange)':'var(--line)'; b.style.background=on?'rgba(245,130,32,.08)':'var(--bg)'; });
      slotWrap.style.display='none'; slotsEl.innerHTML=''; noteEl.textContent=PT('Buscando horas…','Loading times…'); noteEl.style.color='var(--ink2)';
      fetch(SUPA+'/functions/v1/grooming_slots',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json','Authorization':'Bearer '+ANON},body:JSON.stringify({date:ds})})
        .then(function(r){return r.json();}).then(function(d){
          var taken=(d&&d.taken)||[]; var closed=!!(d&&d.closed);
          var all=(d&&d.times&&d.times.length)?d.times:st.slots;
          var free=closed?[]:all.filter(function(t){ return taken.indexOf(t)<0; });
          // Regla de HOY: solo horas ≥1h de anticipación y antes de las 2 PM (3h antes del último slot 5 PM).
          var todayS=ymdLocal(new Date());
          if(ds===todayS){
            var now=new Date(); var nowMin=now.getHours()*60+now.getMinutes();
            var lastSlot=all.length?slotMin(all[all.length-1]):1020; var cutoff=lastSlot-180;
            if(nowMin>=cutoff){ free=[]; }
            else { free=free.filter(function(t){ return slotMin(t) >= nowMin+60; }); }
          }
          renderSlots(free, ds===todayS);
        }).catch(function(){ noteEl.textContent=PT('No se pudo cargar. Intenta de nuevo.','Could not load. Try again.'); noteEl.style.color='#C0392B'; });
    }
    function renderSlots(free, isToday){
      if(!free.length){
        slotWrap.style.display='none';
        noteEl.style.color=isToday?'#C2521E':'var(--ink2)';
        noteEl.innerHTML = isToday
          ? PT('Para hoy ya no hay reserva en línea. Si deseas agendar para hoy, llámanos al ','No online booking left for today. To book for today, call us at ')+'<a href="tel:'+GROOM_CALL.replace(/[^0-9]/g,'')+'" style="color:var(--orange);font-weight:700">'+GROOM_CALL+'</a>. '+PT('Nuestra última reserva es a las 5 PM.','Our last appointment is at 5 PM.')
          : PT('No quedan horas libres ese día. Elige otro.','No free times that day. Pick another.');
        return;
      }
      slotWrap.style.display='block'; noteEl.textContent='';
      slotsEl.innerHTML=free.map(function(t){ return '<button type="button" class="rs-slot" data-t="'+t+'" style="border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--ink)">'+t+'</button>'; }).join('');
      Array.prototype.forEach.call(slotsEl.querySelectorAll('.rs-slot'), function(b){ b.onclick=function(){
        st.time=b.getAttribute('data-t'); goBtn.disabled=false;
        Array.prototype.forEach.call(slotsEl.querySelectorAll('.rs-slot'), function(x){ var on=x===b; x.style.borderColor=on?'var(--orange)':'var(--line)'; x.style.background=on?'var(--orange)':'var(--bg)'; x.style.color=on?'#fff':'var(--ink)'; });
      }; });
    }
    goBtn.onclick=function(){
      var m=ov.querySelector('#rs-msg'), b=this;
      if(!st.day||!st.time){ m.className='msg err'; m.textContent=PT('Elige día y hora.','Pick day and time.'); return; }
      b.disabled=true; b.textContent=PT('Enviando…','Sending…');
      fetch(SUPA+'/functions/v1/grooming_manage',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify({action:'reschedule',id:id,appointment_date:st.day,appointment_time:st.time,lang:PLANG})})
        .then(function(r){return r.json();}).then(function(x){
          if(x.error){ m.className='msg err'; m.textContent=x.error; b.disabled=false; b.textContent=PT('Solicitar cambio','Request change'); return; }
          m.className='msg ok'; m.textContent=PT('¡Solicitud enviada! Te confirmamos el nuevo horario en breve.','Request sent! We\'ll confirm your new time shortly.');
          setTimeout(function(){ ov.close(); load(); },1400);
        }).catch(function(){ m.className='msg err'; m.textContent=PT('No se pudo enviar.','Could not send it.'); b.disabled=false; b.textContent=PT('Solicitar cambio','Request change'); });
    };
    // Config del CRM (horas reales + días cerrados), luego pinta el calendario.
    fetch(SUPA+'/functions/v1/grooming_slots',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json','Authorization':'Bearer '+ANON},body:'{}'})
      .then(function(r){return r.json();}).then(function(cf){ if(cf){ if(cf.times&&cf.times.length) st.slots=cf.times; if(cf.closed_days) st.closed=cf.closed_days; if(cf.cap) st.cap=cf.cap; } renderDays(); })
      .catch(function(){ renderDays(); });
  };

      '<button class="btn sm" style="margin-top:14px" onclick="profileEdit()">'+svg('pen',14)+' '+PT('Editar mi perfil','Edit my profile')+'</button>'+

  function profileComplete(c){
    if(!c) return false;

    for(var i=0;i<need.length;i++){ if(!String(c[need[i]]||'').trim()) return false; }
    return true;

      return '<span class="bdg'+(got?'':' lock')+'" title="'+esc(b.description||'')+(got?'':(' — '+PT('aún no la tienes','not yet earned')))+'">'+
        '<span class="em">'+esc(b.icon||'')+'</span>'+esc(nm)+(got?'':' 🔒')+'</span>';
    }).join('')+'</div>';
  }

  async function load(){
    root.innerHTML='<div class="card"><div class="center"><div class="spin"></div>'+PT('Cargando tu perfil…','Loading your profile…')+'</div></div>';
    var s=await sb.auth.getSession();
    var tok=s.data&&s.data.session&&s.data.session.access_token;
    if(!tok){ showLogin({k:'err',t:PT('Sesión expirada, vuelve a entrar.','Session expired, sign in again.')}); return; }
    try{
      var r=await fetch(SUPA+'/functions/v1/portal_data',{method:'POST',headers:{'Authorization':'Bearer '+tok,'apikey':ANON,'Content-Type':'application/json'},body:'{}'});
      var d=await r.json();
      if(d.error){ root.innerHTML='<div class="card"><div class="msg err">'+esc(d.error)+'</div></div>'; return; }
      render(d);
    }catch(e){ root.innerHTML='<div class="card"><div class="msg err">'+PT('No pudimos cargar tu perfil. Intenta de nuevo.','We could not load your profile. Try again.')+'</div></div>'; }
  }

  document.getElementById('logout').onclick=function(e){ e.preventDefault();
    sb.auth.signOut().then(function(){ showLogin({k:'info',t:PT('Sesión cerrada.','Signed out.')}); document.getElementById('logout').style.display='none'; }); };

  // ---- Retorno de Stripe tras pagar servicios extra (?addon=cs_...) ----
  var _addonDone=false;
  function addonBanner(kind,html){
    var b=document.createElement('div'); b.className='wrap'; b.style.paddingBottom='0';
    b.innerHTML='<div class="msg '+kind+'" style="margin-top:0">'+html+'</div>';
    if(root&&root.parentNode) root.parentNode.insertBefore(b,root); else document.body.appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },14000);
  }
  async function addonReturn(){
    if(_addonDone) return; _addonDone=true;
    var sid=null; try{ sid=new URLSearchParams(location.search).get('addon'); }catch(e){}
    if(!sid) return;
    try{ history.replaceState({},'',location.pathname+location.hash); }catch(e){}
    if(sid.indexOf('cs_')!==0) return;
    try{
      var r=await fetch(SUPA+'/functions/v1/grooming_extra',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({action:'addon_confirm',session_id:sid})});
      var d=await r.json();
      if(d&&d.ok){
        addonBanner('ok','<b>'+PT('¡Listo! Servicios agregados a tu cita.','All set! Services added to your appointment.')+'</b>'+
          (d.total?('<br>'+PT('Pagado','Paid')+': $'+Number(d.total).toFixed(2)):'')+
          '<br>'+PT('Te enviamos el recibo por correo.','We emailed you the receipt.'));
      }else if(d&&d.pending){
        addonBanner('info',PT('Tu pago se está procesando. En un momento verás los servicios en tu cita.','Your payment is processing. Your services will appear on the appointment shortly.'));
      }
    }catch(e){}
  }

  applyStatic();
  sb.auth.getSession().then(function(s){ if(s.data&&s.data.session&&s.data.session.user){ addonReturn().then(load,load); } else showLogin(null); });
  sb.auth.onAuthStateChange(function(_e,session){ if(session&&session.user){ addonReturn().then(load,load); } });
})();
</script>
