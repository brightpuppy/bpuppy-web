<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<script>try{var _bl=localStorage.getItem('bpuppy-lang');if(!_bl){_bl=(((navigator.language||navigator.userLanguage||'')+'').toLowerCase().indexOf('es')===0)?'es':'en';localStorage.setItem('bpuppy-lang',_bl);}document.documentElement.lang=_bl;}catch(e){}/*bplangboot*/</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mi perfil — BPuppy</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="assets/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --orange:#F58220;--orange2:#C2521E;--ink:#241C18;--ink2:#6b5c50;--soft:#9d8e80;
  --paper:#FBF7F0;--bg:#fff;--line:#EADFCE;--line2:#F2E9DA;
  --green:#12A47A;--violet:#7C3AED;--blue:#2563EB;
  --r:20px;--rs:14px;
  --shadow:0 1px 2px rgba(36,28,24,.04), 0 8px 28px -14px rgba(36,28,24,.16);
  --shadow-lift:0 2px 6px rgba(36,28,24,.06), 0 18px 44px -18px rgba(36,28,24,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}

/* ── animaciones ── */
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
@keyframes popout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes hue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes slide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.rise{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
.rise:nth-child(2){animation-delay:.05s}.rise:nth-child(3){animation-delay:.1s}.rise:nth-child(4){animation-delay:.15s}

/* ── header ── */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 18px;background:rgba(251,247,240,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
header .brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:15px;letter-spacing:-.01em}
header .brand img{height:28px}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);text-decoration:none;cursor:pointer;
  transition:border-color .16s,color .16s,transform .16s}
.hbtn:hover{border-color:var(--orange);color:var(--orange2);transform:translateY(-1px)}
.hbtn.ghost{border-style:dashed}

.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}

/* ── avatar (sin foto de portada) ── */
/* Banda de color suave arriba, solo para dar aire. El avatar YA no se recorta:
   la tarjeta deja de tener overflow:hidden y el avatar cabe completo dentro. */
.topband{height:96px;border-radius:0 0 26px 26px;background:
  linear-gradient(135deg,#FFE9D2,#FFD9E4 45%,#E4E7FF);border:1px solid var(--line);border-top:none}
.camchip{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(36,28,24,.5);
  color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);transition:background .16s}
.camchip:hover{background:rgba(36,28,24,.72)}

.idcard{position:relative;margin:-34px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:0 24px 22px;box-shadow:var(--shadow)}
.idcard .rainbow{height:3px;margin:0 -24px 0;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,#F55820,#E83860,#7C3AED,#2563EB,#12A47A,#F5A623,#F55820);
  background-size:200% 100%;animation:slide 9s linear infinite}
.av{position:relative;width:118px;height:118px;margin:-56px 0 0;border-radius:50%;border:5px solid var(--bg);
  background:linear-gradient(135deg,#F55820,#E83860);display:grid;place-items:center;color:#fff;
  font-family:'Bricolage Grotesque',sans-serif;font-size:40px;font-weight:800;box-shadow:0 10px 26px -8px rgba(36,28,24,.44)}
/* La imagen se recorta redonda, pero el botón de cámara (.pen) queda FUERA y visible. */
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av .pen{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--bg);
  background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .16s}
.av .pen:hover{transform:scale(1.12)}
h1.nm{font-family:'Bricolage Grotesque',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.02em;margin:14px 0 3px;line-height:1.1}
.sub{font-size:13.5px;color:var(--ink2)}
.memchip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:800;
  border:1.5px solid;background:var(--bg);margin-top:10px}
.nextcita{display:flex;align-items:center;gap:11px;margin-top:14px;padding:11px 14px;border-radius:14px;
  background:linear-gradient(135deg,#FFF3E9,#FFE9F0);border:1px solid #F6D9C6}
.nextcita .ic{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--orange2);flex-shrink:0}
.nextcita .k{font-size:10.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.4px}
.nextcita .v{font-size:14px;font-weight:800;color:var(--ink);margin-top:1px}
.aboutme{margin-top:14px;border-top:1px dashed var(--line2);padding-top:12px}
.aboutme p{font-size:13px;color:var(--ink2);line-height:1.55;text-wrap:pretty;margin:0}
.aboutme p.ph{color:var(--soft);font-style:italic}
.aboutme .lnk{margin-top:6px;background:none;border:none;color:var(--orange2);font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:0}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
.stat{border:1px solid var(--line);border-radius:var(--rs);padding:13px 10px;text-align:center;background:var(--bg);
  transition:border-color .16s,transform .16s}
.stat:hover{border-color:var(--orange);transform:translateY(-2px)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:23px;font-weight:800;line-height:1}
.stat span{display:block;font-size:10.5px;color:var(--soft);font-weight:700;margin-top:4px;letter-spacing:.01em}

/* ── insignias ── */
.bgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.bdg{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);font-size:12px;font-weight:700;cursor:default;transition:transform .16s,border-color .16s}
.bdg:hover{transform:translateY(-2px);border-color:var(--orange)}
.bdg .em{font-size:15px;line-height:1}
.bdg.lock{opacity:.5;border-style:dashed;color:var(--soft);filter:grayscale(1)}
.bdg.lock:hover{opacity:.85;filter:none}

/* ── tabs (outline, sin relleno) ── */
.tabs{display:flex;gap:8px;margin:22px 0 18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink2);font-family:inherit;font-size:13.5px;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:all .16s}
.tab:hover{border-color:var(--orange);color:var(--ink)}
.tab.on{border-color:var(--orange);color:var(--orange2);box-shadow:inset 0 0 0 1px var(--orange)}
.tab .n{background:var(--paper);border-radius:999px;padding:1px 7px;font-size:11px;color:var(--ink2)}
.pane{display:none}.pane.on{display:block;animation:fade .25s ease both}

/* ── tarjetas ── */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tint{border-left:3px solid var(--orange)}
.ttl{font-family:'Bricolage Grotesque',sans-serif;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.lb{font-size:10.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:13.5px}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink2)}.row .v{font-weight:700;text-align:right}
.muted{font-size:12.5px;color:var(--ink2);line-height:1.65}

/* ── mascotas ── */
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}
.pet{background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s}
.pet:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--orange)}
.pet .ph{height:132px;background:linear-gradient(135deg,#FFEEDC,#FFE1EA);display:grid;place-items:center;position:relative;overflow:hidden}
.pet .ph img{width:100%;height:100%;object-fit:cover}
.pet .bd{padding:12px 14px 14px}
.pet .nm2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800}
.pet .br{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--orange2);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.pet .mt{font-size:11.5px;color:var(--soft);margin-top:6px}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.tag.warn{background:#FFF4E0;color:#8A5A00;border:1px solid #F2D9A6}
.tag.ok{background:#E6F7F1;color:#0B6B4F;border:1px solid #B8E6D5}
.addtile{border:1.5px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;min-height:190px;color:var(--ink2);cursor:pointer;background:transparent;
  font-weight:700;font-size:13.5px;transition:all .18s}
.addtile:hover{border-color:var(--orange);color:var(--orange2);background:var(--bg)}
.addtile .plus{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:21px}

/* ── botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;font-weight:800;
  cursor:pointer;text-decoration:none;transition:all .16s}
.btn:hover{border-color:var(--orange);color:var(--orange2);transform:translateY(-2px)}
.btn.pri{border-color:transparent;background:linear-gradient(135deg,#F55820,#E83860);color:#fff;box-shadow:0 10px 24px -12px rgba(245,88,32,.9)}
.btn.pri:hover{color:#fff;filter:brightness(1.06)}
.btn.w{width:100%}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:11px}

/* ── descubre ── */
.disc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.dl{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:var(--rs);
  background:var(--bg);text-decoration:none;transition:all .18s}
.dl:hover{border-color:var(--orange);transform:translateX(4px)}
.dl .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:18px;border:1px solid var(--line)}
.dl .t{font-weight:800;font-size:13.5px}
.dl .d{font-size:11.5px;color:var(--soft);margin-top:1px;line-height:1.4}

/* ── formularios / modales ── */
label{display:block;font-size:10.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:inherit;
  font-size:15px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .16s}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
textarea{min-height:88px;resize:vertical;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;z-index:120;background:rgba(36,28,24,.55);backdrop-filter:blur(4px);display:flex;
  align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;animation:fade .16s ease both}
.ov.out{animation:fade .14s ease reverse both}
.modal{background:var(--bg);border-radius:24px;max-width:520px;width:100%;padding:24px;box-shadow:0 30px 80px -20px rgba(36,28,24,.6);
  animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
.ov.out .modal{animation:popout .14s ease both}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.x{border:none;background:var(--paper);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--ink2);transition:transform .14s}
.x:hover{transform:rotate(90deg);background:#FDE7E7;color:#B4232A}
.msg{border-radius:12px;padding:11px 14px;font-size:13.5px;margin-top:12px;line-height:1.5}
.msg.err{background:#FDECEC;color:#9B1C1C;border:1px solid #F5C2C2}
.msg.ok{background:#E6F7F1;color:#0B6B4F;border:1px solid #B8E6D5}
.msg.info{background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE}
.nudge{border:1px dashed var(--orange);background:#FFF8F1;border-radius:var(--rs);padding:12px 15px;font-size:13px;
  color:var(--orange2);margin-top:14px;line-height:1.55}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto 12px}
.center{text-align:center;padding:34px 10px;color:var(--ink2)}
.empty{text-align:center;padding:30px 16px}
.empty .ic{font-size:34px;opacity:.5;margin-bottom:8px}
.empty .t{font-weight:800;font-size:15px;margin-bottom:4px}
.empty .d{font-size:13px;color:var(--ink2);line-height:1.6}
.bar{height:7px;background:var(--paper);border-radius:999px;overflow:hidden;margin:10px 0 5px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#F55820,#E83860);border-radius:999px}
.bk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--rs);margin-bottom:9px;transition:border-color .16s}
.bk:hover{border-color:var(--orange)}
.cardpm{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:var(--rs);background:var(--paper)}
.cardpm .chip{width:46px;height:31px;border-radius:6px;background:linear-gradient(135deg,#241C18,#4a3b31);color:#fff;
  display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em}

/* ── login ── */
.login{max-width:430px;margin:56px auto 0}
.hero{text-align:center;padding:44px 20px 10px}
.hero .eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange2);font-weight:800}
.hero h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,6vw,50px);line-height:1.05;margin:10px 0 8px}
.hero h1 em{font-style:italic;color:var(--orange2)}
.hero p{color:var(--ink2);max-width:44ch;margin:0 auto;font-size:15px;line-height:1.6}

footer{text-align:center;padding:28px 16px 40px;font-size:12.5px;color:var(--soft);line-height:1.7}
footer a{color:var(--orange2);text-decoration:none;font-weight:700}

/* ── pet card: todo alineado, estado abajo, botón de foto ── */
.pet .bd{display:flex;flex-direction:column;min-height:104px}
.pet .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pet .psumm{font-size:12px;color:var(--ink2);line-height:1.45;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.pet .nextline{font-size:11.5px;font-weight:700;color:var(--green);margin-top:7px;display:flex;align-items:center;gap:5px;line-height:1.3}
.pet .tag.ok svg,.pet .tag.warn svg{vertical-align:-1px}
.pet .phcam{position:absolute;right:9px;bottom:9px;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);
  background:rgba(36,28,24,.5);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:background .16s,transform .16s;z-index:2}
.pet .phcam:hover{background:rgba(36,28,24,.75);transform:scale(1.08)}

/* ── insignias: clic para ver la nota ── */
.bdg{cursor:pointer}
.bdg .ico{display:inline-flex;color:currentColor}
.badgehero{display:flex;align-items:center;gap:5px}

/* ── Logros ── */
.lg-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.lg-ring{--p:0;width:66px;height:66px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--orange) calc(var(--p)*1%), var(--line) 0);position:relative}
.lg-ring::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.lg-ring b{position:relative;z-index:1;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800}
.lg-cat{margin-top:18px}
.lg-cat .h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:9px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.lbadge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:15px 10px 13px;border:1px solid var(--line);
  border-radius:var(--rs);background:var(--bg);cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
.lbadge:hover{transform:translateY(-3px);border-color:var(--orange);box-shadow:var(--shadow)}
.lbadge .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.lbadge .nm{font-size:12px;font-weight:800;line-height:1.2}
.lbadge .pt{font-size:10.5px;font-weight:700;color:var(--soft)}
.lbadge.lock{opacity:.72}
.lbadge.lock .ic{background:var(--line2)!important;color:var(--soft)}
.lbadge.lock .nm{color:var(--ink2)}

/* ── Planes friendly ── */
.plan{border:1.5px solid var(--line);border-radius:var(--r);padding:17px 18px;background:var(--bg);transition:border-color .16s,box-shadow .16s;position:relative}
.plan.current{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.plan .cur{position:absolute;top:-10px;left:18px;background:linear-gradient(135deg,#F55820,#E83860);color:#fff;font-size:10.5px;font-weight:800;
  letter-spacing:.04em;padding:3px 11px;border-radius:999px;text-transform:uppercase}
.plan .up{position:absolute;top:14px;right:16px}
.plan .pn{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800}
.plan .pp{font-size:12.5px;color:var(--ink2)}

/* ── Descubre con vida ── */
.disc2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.dcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:16px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg);text-decoration:none;transition:transform .18s,box-shadow .18s,border-color .18s;min-height:118px}
.dcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:transparent}
.dcard .glow{position:absolute;inset:0;opacity:.1;transition:opacity .18s}
.dcard:hover .glow{opacity:.2}
.dcard .ic{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.dcard .t{position:relative;font-weight:800;font-size:14px;letter-spacing:-.01em}
.dcard .d{position:relative;font-size:12px;color:var(--ink2);line-height:1.45;margin-top:auto}
.dcard .arw{position:absolute;top:15px;right:15px;color:var(--soft);transform:rotate(45deg);transition:transform .18s,color .18s}
.dcard:hover .arw{transform:rotate(45deg) translate(2px,-2px);color:var(--ink)}

/* ── Cuenta coqueta ── */
.acct{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acct .card{margin-bottom:0}
.acct .full{grid-column:1/-1}
.acard-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}

/* ── Otros datos / preferencias ── */
.odsec{border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px;margin-top:10px}
.odsec>.h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:9px}
.odsec>.h .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--paper)}
.dchip button{border:none;background:none;color:var(--soft);cursor:pointer;padding:0;display:grid;place-items:center}
.dchip button:hover{color:#B4232A}
.tchip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;transition:border-color .14s,background .14s,color .14s}
.tchip.on{border-color:var(--orange);background:rgba(245,130,32,.1);color:var(--orange2)}
.ptog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .16s}
.ptog:hover{border-color:var(--orange)}
.ptog .lt{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700}
.ptog .lt .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .18s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ptog.on .sw{background:var(--orange)}
.ptog.on .sw::after{transform:translateX(18px)}

/* ── mini day/slot picker (compartido) ── */
.mini-days{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mini-days::-webkit-scrollbar{display:none}
.mini-day{flex:0 0 auto;min-width:54px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;font-family:inherit}
.mini-slots{display:flex;gap:7px;flex-wrap:wrap}
.mini-slot{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--ink)}

@media(max-width:640px){
  .acct{grid-template-columns:1fr}
  .wrap{padding:0 12px 70px}
  .topband{height:78px;border-radius:0 0 20px 20px}
  .idcard{padding:0 17px 18px;border-radius:18px}
  .idcard .rainbow{margin:0 -17px}
  .av{width:98px;height:98px;margin-top:-48px;font-size:33px}
  h1.nm{font-size:23px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .modal{padding:19px;border-radius:19px}
}

  /* ═══ subir foto ═══ */
  function pickPhoto(cb){
    var inp=document.getElementById('upfile');
    inp.value='';
    inp.onchange=async function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      if(f.size>8*1024*1024){ alert(PT('La foto es muy grande (máx. 8 MB).','That photo is too big (8 MB max).')); return; }
      try{
        var ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
        var path=(D&&D.client&&D.client.id?D.client.id:'anon')+'/'+Date.now()+'.'+ext;
        var up=await sb.storage.from('portal-photos').upload(path,f,{upsert:true,contentType:f.type||'image/jpeg'});
        if(up.error) throw up.error;
        var pub=sb.storage.from('portal-photos').getPublicUrl(path);
        cb(pub.data.publicUrl);
      }catch(e){ alert(PT('No se pudo subir la foto.','We could not upload the photo.')); }
    };
    inp.click();
  }
  async function api(body){
    var s=await sb.auth.getSession();
    var tok=s.data&&s.data.session&&s.data.session.access_token;
    if(!tok) return {error:'no_auth'};
    var r=await fetch(SUPA+'/functions/v1/portal_data',{method:'POST',headers:{'Authorization':'Bearer '+tok,'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    return await r.json();
  }

      PT('Agenda reservada siempre para ti','Priority slots always held for you'),
      PT('Reporte de pelaje y regalo de cumpleaños','Coat report and birthday gift')]};
    if(s.indexOf('total')>=0) return {label:'Total',color:'#C2521E',soft:'#FFF2E6',billing:billing,perks:[
      PT('1 baño + corte al mes','1 bath + haircut per month'),
      PT('Uñas y oídos incluidos','Nails and ears included'),

      PT('15% de descuento en servicios extra','15% off extra services'),
      PT('Prioridad en agenda y foto mensual','Priority booking and a monthly photo')]};
    return {label:'Esencial',color:'#12A47A',soft:'#E7F7F1',billing:billing,perks:[
      PT('1 baño completo al mes','1 full bath per month'),
      PT('Uñas incluidas','Nails included'),

      PT('Recordatorios automáticos de tu cita','Automatic appointment reminders')]};

  function topPlan(ms){
    var order={VIP:3,Total:2,Esencial:1}, best=null;

  window.addServices=function(gid){
    var st={ gid:gid, services:[], pickup:false, quote:null, upgrade:null };
    var ov=modal(PT('Agregar servicios','Add services'),
      '<div id="as-plan" style="margin-bottom:12px"></div>'+
      '<p class="muted" style="margin:0 0 12px">'+PT('Tu descuento de miembro se aplica solo. No incluimos lo que ya trae tu plan.','Your member discount applies automatically. What your plan already includes is left out.')+'</p>'+
      '<label style="margin-top:0">'+PT('Elige servicios','Choose services')+'</label>'+
      '<div id="as-svcs" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px"><span class="muted" style="font-size:12.5px">'+PT('Cargando…','Loading…')+'</span></div>'+
      '<label style="display:flex;gap:9px;align-items:center;font-size:14px;font-weight:700;margin:0 0 12px;cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px">'+
        '<input type="checkbox" id="as-pickup"> '+svg('truck',16,2)+' '+PT('Recogida y entrega a domicilio','Home pickup & delivery')+
        '<span id="as-pknote" style="margin-left:auto;font-size:12px;color:var(--ink2)"></span></label>'+
      '<div id="as-total" style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:10px">'+PT('Elige servicios…','Pick services…')+'</div>'+
      '<div id="as-up"></div>'+
      '<div id="as-msg"></div>'+
      '<button class="btn pri w" id="as-go" style="margin-top:12px">'+PT('Pagar','Pay')+'</button>', 500);
    var svcsEl=ov.querySelector('#as-svcs'), totEl=ov.querySelector('#as-total'), upEl=ov.querySelector('#as-up'),
        planEl=ov.querySelector('#as-plan'), pkEl=ov.querySelector('#as-pickup'), pkNote=ov.querySelector('#as-pknote'),
        goBtn=ov.querySelector('#as-go'), msg=ov.querySelector('#as-msg');
    function calc(){
      st.services=[]; try{ svcsEl.querySelectorAll('[data-on="1"]').forEach(function(e){ st.services.push(e.getAttribute('data-svc')); }); }catch(e){}
      st.pickup=!!pkEl.checked;
      fetch(SUPA+'/functions/v1/grooming_extra',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json','Authorization':'Bearer '+ANON},
        body:JSON.stringify({action:'addon_quote',grooming_id:st.gid,services:st.services,pickup:st.pickup,lang:PLANG})})
        .then(function(r){return r.json();}).then(function(d){
          if(!d||!d.ok){ totEl.textContent=(d&&d.error)||PT('No se pudo calcular','Could not calculate'); return; }
          st.quote=d.quote; st.upgrade=d.upgrade;
          if(planEl) planEl.innerHTML = d.membership ? planChip(d.membership.plan) : '';
          if(d.membership){ st.plan=d.membership.plan; var _incl=includedService(st.plan); try{ svcsEl.querySelectorAll('[data-svc]').forEach(function(bt){ if(bt.getAttribute('data-svc')===_incl){ bt.style.display='none'; bt.setAttribute('data-on','0'); } }); }catch(e){} }
          if(pkNote) pkNote.textContent = d.quote.pickup_included ? PT('Incluido en tu plan','Included in your plan') : '+$20';
          var q=d.quote;
          totEl.innerHTML = q.items.length
            ? (q.items.map(function(i){ return '<div style="display:flex;justify-content:space-between;color:var(--ink2)"><span>'+esc(i.name)+(i.included?(' <b style="color:#12A47A">'+PT('incluido','included')+'</b>'):'')+'</span><span>$'+Number(i.price||0).toFixed(2)+'</span></div>'; }).join('')
              + (q.discount>0?('<div style="display:flex;justify-content:space-between;color:#12A47A;font-weight:700"><span>'+PT('Descuento de miembro','Member discount')+' ('+Math.round(q.pct*100)+'%)</span><span>-$'+q.discount.toFixed(2)+'</span></div>'):'')
              + '<div style="display:flex;justify-content:space-between;color:var(--ink2)"><span>'+PT('Impuesto FL','FL tax')+' '+q.tax_pct+'%</span><span>$'+q.tax.toFixed(2)+'</span></div>'
              + '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:7px;padding-top:7px"><span>'+PT('Total','Total')+'</span><span>$'+q.total.toFixed(2)+'</span></div>')
            : PT('Elige servicios…','Pick services…');
          upEl.innerHTML = d.upgrade
            ? ('<button type="button" onclick="planChange()" style="display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;background:none;border:none;padding:2px 0;font-family:inherit;font-size:12.5px;color:#7C3AED;font-weight:700;cursor:pointer;text-align:left">'
              + svg('up',15,2)+'<span>'+PT('Con el ','With ')+esc(d.upgrade.target_label)+PT(' esto vendría incluido por +$','—this would be included for +$')+Number(d.upgrade.monthly_diff).toFixed(0)+PT('/mes. Ver planes →','/mo. See plans →')+'</span></button>')
            : '';
        }).catch(function(){ totEl.textContent=PT('Error de red','Network error'); });
    }
    fetch(SUPA+'/functions/v1/grooming_extra',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json','Authorization':'Bearer '+ANON},body:JSON.stringify({action:'services'})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.services){ svcsEl.innerHTML=''; return; }
        svcsEl.innerHTML=d.services.map(function(s){
          return '<button type="button" data-svc="'+esc(s.name)+'" data-on="0" style="border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer">'+esc(s.name)+' $'+s.price+'</button>';
        }).join('');
        svcsEl.querySelectorAll('[data-svc]').forEach(function(b){ b.onclick=function(){
          var on=b.getAttribute('data-on')==='1'; b.setAttribute('data-on',on?'0':'1');
          b.style.borderColor=on?'var(--line)':'var(--orange)'; b.style.background=on?'var(--bg)':'rgba(245,130,32,.09)'; b.style.color=on?'var(--ink)':'var(--orange)';
          calc();
        }; });
        calc();
      }).catch(function(){ svcsEl.innerHTML=''; });
    pkEl.onchange=calc;
    goBtn.onclick=function(){
      if(!st.quote || !st.quote.items.length){ msg.className='msg err'; msg.textContent=PT('Elige al menos un servicio.','Pick at least one service.'); return; }
      if(!(st.quote.total>0)){ msg.className='msg ok'; msg.textContent=PT('Todo lo que elegiste ya viene incluido en tu plan.','Everything you picked is already included in your plan.'); return; }
      goBtn.disabled=true; goBtn.textContent=PT('Conectando con el pago…','Connecting to payment…');
      fetch(SUPA+'/functions/v1/grooming_extra',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json','Authorization':'Bearer '+ANON},
        body:JSON.stringify({action:'addon_checkout',grooming_id:st.gid,services:st.services,pickup:st.pickup,lang:PLANG,created_by:'cliente'})})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&d.url){ location.href=d.url; return; }
          msg.className='msg err'; msg.textContent=(d&&d.error)||PT('No se pudo iniciar el pago.','Could not start the payment.');
          goBtn.disabled=false; goBtn.textContent=PT('Pagar','Pay');
        }).catch(function(){ msg.className='msg err'; msg.textContent=PT('Error de red.','Network error.'); goBtn.disabled=false; goBtn.textContent=PT('Pagar','Pay'); });
    };
  };

  /* ═══ AGENDAR desde el portal — MISMO menú/opciones que la web (coordinado). Perfil y preferencias
        del perro se prellenan; se puede "regalar" a otra mascota del mismo tipo. ═══ */
  function includedService(plan){ var s=String(plan||'').toLowerCase();
    if(s.indexOf('vip')>=0) return 'Spa VIP'; if(s.indexOf('total')>=0) return 'Bano + Corte'; return 'Bano completo'; }
  window.bookPet=function(petId){
    var pets=(D&&D.pets||[]).filter(function(x){return String(x.status||'')!=='pending';});
    if(!pets.length){ alert(PT('Primero agrega una mascota confirmada.','Add a confirmed pet first.')); return; }
    var c=(D&&D.client)||{};
    var owner=((c.first_name||'')+' '+(c.last_name||'')).trim()||(D&&D.email)||'';

      Array.prototype.forEach.call(daysEl.querySelectorAll('.rs-day'), function(b){ b.onclick=function(){ pickDay(b.getAttribute('data-d'), b); }; });
    }
    function pickDay(ds, btn){
      st.day=ds; st.time=''; goBtn.disabled=true;
      Array.prototype.forEach.call(daysEl.querySelectorAll('.rs-day'), function(b){ var on=b===btn; b.style.borderColor=on?'var(--orange)':'var(--line)'; b.style.background=on?'rgba(245,130,32,.08)':'var(--bg)'; });
      slotWrap.style.display='none'; slotsEl.innerHTML=''; noteEl.textContent=PT('Buscando horas…','Loading times…'); noteEl.style.color='var(--ink2)';
      fetch(SUPA+'/functions/v1/grooming_slots',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json','Authorization':'Bearer '+ANON},body:JSON.stringify({date:ds})})
        .then(function(r){return r.json();}).then(function(d){
          var taken=(d&&d.taken)||[]; var closed=!!(d&&d.closed);
          var all=(d&&d.times&&d.times.length)?d.times:st.slots;
          var free=closed?[]:all.filter(function(t){ return taken.indexOf(t)<0; });
          // Regla de HOY: solo horas ≥1h de anticipación y antes de las 2 PM (3h antes del último slot 5 PM).
          var todayS=ymdLocal(new Date());
          if(ds===todayS){
            var now=new Date(); var nowMin=now.getHours()*60+now.getMinutes();
            var lastSlot=all.length?slotMin(all[all.length-1]):1020; var cutoff=lastSlot-180;
            if(nowMin>=cutoff){ free=[]; }
            else { free=free.filter(function(t){ return slotMin(t) >= nowMin+60; }); }
          }
          renderSlots(free, ds===todayS);
        }).catch(function(){ noteEl.textContent=PT('No se pudo cargar. Intenta de nuevo.','Could not load. Try again.'); noteEl.style.color='#C0392B'; });
    }
    function renderSlots(free, isToday){
      if(!free.length){
        slotWrap.style.display='none';
        noteEl.style.color=isToday?'#C2521E':'var(--ink2)';
        noteEl.innerHTML = isToday
          ? PT('Para hoy ya no hay reserva en línea. Si deseas agendar para hoy, llámanos al ','No online booking left for today. To book for today, call us at ')+'<a href="tel:'+GROOM_CALL.replace(/[^0-9]/g,'')+'" style="color:var(--orange);font-weight:700">'+GROOM_CALL+'</a>. '+PT('Nuestra última reserva es a las 5 PM.','Our last appointment is at 5 PM.')
          : PT('No quedan horas libres ese día. Elige otro.','No free times that day. Pick another.');
        return;
      }
      slotWrap.style.display='block'; noteEl.textContent='';
      slotsEl.innerHTML=free.map(function(t){ return '<button type="button" class="rs-slot" data-t="'+t+'" style="border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--ink)">'+t+'</button>'; }).join('');
      Array.prototype.forEach.call(slotsEl.querySelectorAll('.rs-slot'), function(b){ b.onclick=function(){
        st.time=b.getAttribute('data-t'); goBtn.disabled=false;
        Array.prototype.forEach.call(slotsEl.querySelectorAll('.rs-slot'), function(x){ var on=x===b; x.style.borderColor=on?'var(--orange)':'var(--line)'; x.style.background=on?'var(--orange)':'var(--bg)'; x.style.color=on?'#fff':'var(--ink)'; });
      }; });
    }
    goBtn.onclick=function(){
      var m=ov.querySelector('#rs-msg'), b=this;
      if(!st.day||!st.time){ m.className='msg err'; m.textContent=PT('Elige día y hora.','Pick day and time.'); return; }
      b.disabled=true; b.textContent=PT('Enviando…','Sending…');
      fetch(SUPA+'/functions/v1/grooming_manage',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify({action:'reschedule',id:id,appointment_date:st.day,appointment_time:st.time,lang:PLANG})})
        .then(function(r){return r.json();}).then(function(x){
          if(x.error){ m.className='msg err'; m.textContent=x.error; b.disabled=false; b.textContent=PT('Solicitar cambio','Request change'); return; }
          m.className='msg ok'; m.textContent=PT('¡Solicitud enviada! Te confirmamos el nuevo horario en breve.','Request sent! We\'ll confirm your new time shortly.');
          setTimeout(function(){ ov.close(); load(); },1400);
        }).catch(function(){ m.className='msg err'; m.textContent=PT('No se pudo enviar.','Could not send it.'); b.disabled=false; b.textContent=PT('Solicitar cambio','Request change'); });
    };
    // Config del CRM (horas reales + días cerrados), luego pinta el calendario.
    fetch(SUPA+'/functions/v1/grooming_slots',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json','Authorization':'Bearer '+ANON},body:'{}'})
      .then(function(r){return r.json();}).then(function(cf){ if(cf){ if(cf.times&&cf.times.length) st.slots=cf.times; if(cf.closed_days) st.closed=cf.closed_days; if(cf.cap) st.cap=cf.cap; } renderDays(); })
      .catch(function(){ renderDays(); });
  };

        '<span class="ic" style="background:linear-gradient(135deg,'+x[2]+','+x[3]+')">'+svg(x[1],20,2)+'</span>'+
        '<span class="arw">'+svg('up',16,2)+'</span>'+
        '<span class="t">'+esc(x[4])+'</span><span class="d">'+esc(x[5])+'</span></a>';
    }).join('')+'</div>';
  }
  function paneCuenta(d){
    var petNm=(d.pets&&d.pets[0]&&d.pets[0].name)||'';
    var petReason=petNm?PT('Mi mascota ('+esc(petNm)+') ya no está con nosotros','My pet ('+esc(petNm)+') is no longer with us'):PT('Mi mascota ya no está con nosotros','My pet is no longer with us');
    var hIco=function(n,c){ return '<span class="acard-ic" style="background:'+c+'">'+svg(n,17,2)+'</span>'; };
    var out='<div class="acct">'+
      '<div class="card"><div class="card-head">'+hIco('pen','#2563EB')+'<div class="ttl">'+PT('Mis datos','My details')+'</div></div>'+
      '<div class="row"><span class="k">'+PT('Nombre','Name')+'</span><span class="v">'+esc((((d.client&&d.client.first_name)||'')+' '+((d.client&&d.client.last_name)||'')).trim()||'—')+'</span></div>'+
      '<div class="row"><span class="k">'+PT('Correo','Email')+'</span><span class="v">'+esc(d.email||'')+'</span></div>'+
      '<div class="row"><span class="k">'+PT('Teléfono','Phone')+'</span><span class="v">'+esc((d.client&&d.client.phone)||'—')+'</span></div>'+
      '<div class="row"><span class="k">'+PT('Dirección','Address')+'</span><span class="v" style="max-width:60%;text-align:right">'+esc([(d.client&&d.client.address),(d.client&&d.client.city),(d.client&&d.client.state),(d.client&&d.client.zip)].filter(Boolean).join(', ')||'—')+'</span></div>'+
      '<div class="row"><span class="k">'+PT('Idioma','Language')+'</span><span class="v">'+esc((d.client&&(d.client.contact_lang||d.client.language))||'Spanish')+'</span></div>'+
      '<button class="btn w" style="margin-top:14px" onclick="profileEdit()">'+svg('pen',16)+' '+PT('Editar mis datos','Edit my details')+'</button></div>'+
      '<div class="card"><div class="card-head">'+hIco('lock','#7C3AED')+'<div class="ttl">'+PT('Tu llave de entrada','Your sign-in key')+'</div></div>'+
      '<p class="muted" style="margin:2px 0 14px">'+PT('Ponte una contraseña y la próxima vez entras de una, sin pasar por el correo. Y si prefieres, siempre está Google.','Set a password and next time you\'re in with one tap, no email trip. Or just use Google, always.')+'</p>'+
      '<button class="btn pri w" onclick="setPassword()">'+svg('check',16)+' '+PT('Crear o cambiar mi contraseña','Set or change my password')+'</button></div>'+
      '</div>';

    if(d.email_opted_out){
      var esAll=String(d.email_optout_scope||'marketing')==='all';
      out+='<div class="card"><div class="ttl">'+PT('Correos detenidos','Emails paused')+'</div>'+
        '<p class="muted" style="margin:8px 0 14px">'+(esAll
          ? PT('No te enviamos NINGÚN correo, ni siquiera el aviso de tus citas ni los recibos.','We are not sending you ANY email, not even your appointment notices or receipts.')
          : PT('No te enviamos promociones, consejos ni recordatorios de volver. Los avisos de tus citas y los recibos sí te siguen llegando.','We are not sending you promotions, tips or reminders to come back. You still get your appointment notices and receipts.'))+'</p>'+
        '<button class="btn pri w" id="pf-resume">'+PT('Reactivar mis correos','Resume my emails')+'</button></div>';
    } else {
      out+='<div class="card"><div class="ttl">'+PT('Correos y notificaciones','Emails and notifications')+'</div>'+
        '<p class="muted" style="margin:8px 0 12px">'+PT('Elige qué dejas de recibir.','Choose what you stop receiving.')+'</p>'+
        // Dos niveles: parar solo lo promocional, o parar todo (incluidos los avisos de la cita).
        '<label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px">'+
          '<input type="radio" name="pf-scope" value="marketing" checked style="margin-top:3px;accent-color:var(--orange)">'+
          '<span><b style="font-size:13.5px">'+PT('Solo promociones y consejos','Promotions and tips only')+'</b>'+
          '<span class="muted" style="display:block;font-size:12px;margin-top:2px">'+PT('Dejas de recibir novedades, consejos, cumpleaños y recordatorios de volver. Los avisos de tus citas y los recibos te siguen llegando.','You stop getting news, tips, birthdays and reminders to come back. You still get your appointment notices and receipts.')+'</span></span>'+
        '</label>'+
        '<label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:12px">'+
          '<input type="radio" name="pf-scope" value="all" style="margin-top:3px;accent-color:var(--orange)">'+
          '<span><b style="font-size:13.5px">'+PT('Absolutamente todos','Absolutely all of them')+'</b>'+
          '<span class="muted" style="display:block;font-size:12px;margin-top:2px;color:#9B1C1C">'+PT('También dejas de recibir el aviso de tus citas y los recibos. No te avisaremos de tu cita.','You also stop getting your appointment notices and receipts. We will not remind you about your appointment.')+'</span></span>'+
        '</label>'+
        '<label>'+PT('Motivo','Reason')+'</label>'+
        '<select id="pf-reason">'+
          '<option value="Demasiados correos">'+PT('Recibo demasiados correos','I get too many emails')+'</option>'+
          '<option value="No me interesa el contenido">'+PT('El contenido no me interesa','The content is not for me')+'</option>'+
          '<option value="Nunca me suscribí">'+PT('Nunca me suscribí','I never signed up')+'</option>'+
          '<option value="'+petReason.replace(/"/g,'&quot;')+'">'+petReason+'</option>'+
          '<option value="Otro">'+PT('Otro motivo','Another reason')+'</option>'+
        '</select>'+
        '<button class="btn w" id="pf-stop" style="margin-top:14px;border-color:#F5C2C2;color:#9B1C1C">'+PT('Detener mis correos','Stop my emails')+'</button></div>';
    }
    return out;
  }

  /* ═══ RENDER ═══ */
  function render(d){
    D=d; setPlangFrom(d.client);
    var hero=document.getElementById('hero'); if(hero) hero.style.display='none';
    document.getElementById('logout').style.display='';

    var c=d.client||{};
    var emailName=(d.email||'').split('@')[0].replace(/[._]+/g,' ').replace(/\b\w/g,function(x){return x.toUpperCase();});
    var name=(c.first_name?((c.first_name+' '+(c.last_name||'')).trim()):(emailName||d.email));
    var loc=[c.city,c.state].filter(Boolean).join(', ');
    var initials=((c.first_name||'?')[0]+((c.last_name||'')[0]||'')).toUpperCase();
    var nPets=(d.pets||[]).length;
    var ms=(d.memberships||[]).filter(function(m){return String(m.status||'')!=='cancelled';});
    var baths=ms.reduce(function(a,m){return a+(m.credits_balance||0);},0);
    var earned=(d.badges||[]).length;
    var top=topPlan(ms);
    var na0=nextApptAny();
    var naLineHtml = na0 ? ('<div class="nextcita"><span class="ic">'+svg('calendar',16,2)+'</span><div style="min-width:0"><div class="k">'+PT('Tu próxima cita','Your next appointment')+'</div><div class="v">'+esc(na0.pet_name||PT('tu mascota','your pet'))+' · '+esc(fmtD(na0.appointment_date))+(na0.appointment_time?(' · '+esc(na0.appointment_time)):'')+'</div></div></div>') : '';
    var aboutBlockHtml = '<div class="aboutme">'+(c.about?('<p>'+esc(c.about)+'</p>'):('<p class="ph">'+PT('Cuéntanos algo sobre ti — se ve en tu perfil.','Tell us a bit about yourself — it shows on your profile.')+'</p>'))+'<button class="lnk" onclick="editAbout()">'+svg('pen',13,2)+' '+(c.about?PT('Editar','Edit'):PT('Escribir sobre mí','Write about me'))+'</button></div>';

    /* Sin foto de portada — solo un aire de color arriba para que la tarjeta respire. */
    coverHost.innerHTML='<div class="topband"></div>';

    var html='<div class="idcard rise"><div class="rainbow"></div>'+
      '<div class="av">'+(c.photo_url?('<img src="'+esc(c.photo_url)+'" alt="">'):esc(initials))+
        '<button class="pen" onclick="setPhoto(\'avatar\')" title="'+PT('Cambiar foto','Change photo')+'">'+svg('cam',14,2)+'</button></div>'+
      '<h1 class="nm">'+PT('Hola, ','Hi, ')+esc(String(name||'').split(' ')[0]||name)+'</h1>'+
      '<div class="sub">'+esc(d.email)+(loc?(' · '+esc(loc)):'')+'</div>'+
      (top?('<div class="memchip" style="border-color:'+top.color+';color:'+top.color+'">'+svg('star',13,2)+' '+PT('Miembro ','Member ')+esc(top.label)+'</div>'):'')+
      naLineHtml+
      '<div class="stats">'+
        '<div class="stat"><b style="color:var(--orange2)">'+nPets+'</b><span>'+PT(nPets===1?'MASCOTA':'MASCOTAS',nPets===1?'PET':'PETS')+'</span></div>'+
        '<div class="stat"><b style="color:var(--green)">'+baths+'</b><span>'+PT('BAÑOS DISP.','BATHS LEFT')+'</span></div>'+
        '<div class="stat"><b style="color:var(--violet)">'+ms.length+'</b><span>'+PT(ms.length===1?'PLAN':'PLANES',ms.length===1?'PLAN':'PLANS')+'</span></div>'+
        '<div class="stat"><b style="color:var(--blue)">'+earned+'</b><span>'+PT('INSIGNIAS','BADGES')+'</span></div>'+
      '</div>'+
      badgesHtml(d)+
      aboutBlockHtml+
      (profileComplete(c)?'':'<div class="nudge">'+PT('Completa tu perfil y desbloqueas la insignia <b>Perfil Completo</b>.','Complete your profile and unlock the <b>Complete Profile</b> badge.')+'</div>')+
      '<button class="btn sm" style="margin-top:14px" onclick="profileEdit()">'+svg('pen',14)+' '+PT('Editar mi perfil','Edit my profile')+'</button>'+
      '</div>';

    var tabs=[['mascotas','paw',PT('Mascotas','Pets'),nPets],
              ['grooming','scissors','Grooming',0],
              ['pagos','card',PT('Pagos','Payments'),0],
              ['descubre','compass',PT('Descubre','Discover'),0],
              ['logros','trophy',PT('Logros','Badges'),earned],
              ['cuenta','mail',PT('Cuenta','Account'),0]];
    html+='<div class="tabs">'+tabs.map(function(t,i){
      return '<button class="tab'+(i===0?' on':'')+'" data-t="'+t[0]+'">'+svg(t[1],16)+' '+esc(t[2])+(t[3]?('<span class="n">'+t[3]+'</span>'):'')+'</button>';
    }).join('')+'</div>';

    html+='<div class="pane on" data-p="mascotas">'+paneMascotas(d)+'</div>'+
      '<div class="pane" data-p="grooming">'+paneGrooming(d)+'</div>'+
      '<div class="pane" data-p="pagos">'+panePagos(d)+'</div>'+
      '<div class="pane" data-p="descubre">'+paneDescubre()+'</div>'+
      '<div class="pane" data-p="logros">'+paneLogros(d)+'</div>'+
      '<div class="pane" data-p="cuenta">'+paneCuenta(d)+'</div>';

    root.innerHTML=html;

    root.querySelectorAll('.tab').forEach(function(b){
      b.onclick=function(){
        var t=b.getAttribute('data-t');
        root.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on',x===b); });
        root.querySelectorAll('.pane').forEach(function(p){ p.classList.toggle('on',p.getAttribute('data-p')===t); });
        if(t==='pagos') loadCard();
      };
    });

    if(window._openPm){ window._openPm=false; setTimeout(function(){ goTab('pagos'); addonBanner('ok','<b>'+PT('¡Tarjeta guardada!','Card saved!')+'</b> '+PT('Ya puedes pagar más rápido.','You can now pay faster.')); },60); }

    var stop=document.getElementById('pf-stop');
    if(stop) stop.onclick=function(){
      var rs=(document.getElementById('pf-reason')||{}).value||'';
      var sc='marketing';
      try{ var sel=document.querySelector('input[name="pf-scope"]:checked'); if(sel) sc=sel.value; }catch(e){}
      var ask = sc==='all'
        ? PT('¿Detener TODOS los correos, incluidos los avisos de tus citas y los recibos? No te avisaremos de tu cita.','Stop ALL emails, including your appointment notices and receipts? We will not remind you about your appointment.')
        : PT('¿Detener las promociones, consejos y recordatorios? Seguirás recibiendo los avisos de tus citas.','Stop promotions, tips and reminders? You will still get your appointment notices.');
      if(!confirm(ask)) return;
      api({action:'stop_emails',reason:rs,scope:sc}).then(function(){ load(); });
    };
    var res=document.getElementById('pf-resume');
    if(res) res.onclick=function(){ api({action:'resume_emails'}).then(function(){ load(); }); };
  }

  function profileComplete(c){
    if(!c) return false;
    var need=['first_name','last_name','phone','address','city','zip'];
    for(var i=0;i<need.length;i++){ if(!String(c[need[i]]||'').trim()) return false; }
    return true;
  }
  function badgesHtml(d){
    var all=d.badges_all||d.badges||[];
    if(!all.length) return '';
    var earned=all.filter(bEarned), locked=all.filter(function(b){return !bEarned(b);});
    var show=earned.slice(); if(locked.length) show.push(locked[0]); // logrados + el próximo por lograr
    var html='<div class="bgrid">'+show.map(function(b){
      var got=bEarned(b), cat=bCat(b);
      return '<span class="bdg'+(got?'':' lock')+'" onclick="badgeNote(\''+esc(b.key)+'\')" title="'+esc(bName(b))+'">'+
        '<span class="ico" style="color:'+(got?cat.c:'var(--soft)')+'">'+svg(bIcon(b),15,1.9)+'</span>'+esc(bName(b))+(got?'':' '+svg('lock',12,2))+'</span>';
    }).join('');
    html+='<span class="bdg" onclick="goTab(\'logros\')" style="border-style:dashed;color:var(--orange2)">'+svg('trophy',14,1.9)+' '+PT('Ver todas','See all')+' ('+earned.length+'/'+all.length+')</span>';
    return html+'</div>';
  }
  var CATIC={client:'medal',membership:'crown',grooming:'scissors',puppy:'paw',community:'users'};
  function paneLogros(d){
    var all=d.badges_all||d.badges||[];
    if(!all.length) return '<div class="card"><div class="empty"><div class="ic">'+svg('trophy',34)+'</div><div class="t">'+PT('Pronto habrá insignias','Badges coming soon')+'</div></div></div>';
    var earned=all.filter(bEarned), pts=earned.reduce(function(a,b){return a+(b.points||0);},0), totalPts=all.reduce(function(a,b){return a+(b.points||0);},0);
    var pctv=all.length?Math.round(earned.length/all.length*100):0;
    var out='<div class="card"><div class="lg-head">'+
      '<div class="lg-ring" style="--p:'+pctv+'"><b>'+earned.length+'/'+all.length+'</b></div>'+
      '<div style="min-width:0"><div class="ttl">'+PT('Tus logros','Your achievements')+'</div>'+
      '<div class="muted" style="font-size:12.5px;margin-top:3px">'+PT('Llevas ','You have ')+'<b style="color:var(--orange2)">'+pts+'</b> '+PT('de ','of ')+totalPts+' '+PT('puntos. Toca una insignia para ver de qué trata.','points. Tap a badge to see what it is.')+'</div></div></div>';
    CATORDER.forEach(function(cat){
      var list=all.filter(function(b){return String(b.category||'client')===cat;});
      if(!list.length) return;
      list.sort(function(a,b){ return ((bEarned(b)?1:0)-(bEarned(a)?1:0)) || ((a.points||0)-(b.points||0)); });
      var ci=BCAT[cat]||BCAT.client;
      out+='<div class="lg-cat"><div class="h"><span style="color:'+ci.c+'">'+svg(CATIC[cat]||'star',14,2)+'</span>'+PT(ci.es,ci.en)+' · '+list.filter(bEarned).length+'/'+list.length+'</div><div class="lgrid">'+
        list.map(function(b){ var got=bEarned(b);
          return '<div class="lbadge'+(got?'':' lock')+'" onclick="badgeNote(\''+esc(b.key)+'\')">'+
            '<div class="ic" style="background:'+(got?ci.c:'')+'">'+svg(bIcon(b),22,1.9)+'</div>'+
            '<div class="nm">'+esc(bName(b))+'</div>'+
            '<div class="pt">'+(got?('+'+(b.points||0)+' '+PT('pts','pts')):(svg('lock',11,2)+' '+PT('por lograr','locked')))+'</div></div>';
        }).join('')+'</div></div>';
    });
    return out;
  }

  async function load(){
    root.innerHTML='<div class="card"><div class="center"><div class="spin"></div>'+PT('Cargando tu perfil…','Loading your profile…')+'</div></div>';
    var s=await sb.auth.getSession();
    var tok=s.data&&s.data.session&&s.data.session.access_token;
    if(!tok){ showLogin({k:'err',t:PT('Sesión expirada, vuelve a entrar.','Session expired, sign in again.')}); return; }
    try{
      var r=await fetch(SUPA+'/functions/v1/portal_data',{method:'POST',headers:{'Authorization':'Bearer '+tok,'apikey':ANON,'Content-Type':'application/json'},body:'{}'});
      var d=await r.json();
      if(d.error){ root.innerHTML='<div class="card"><div class="msg err">'+esc(d.error)+'</div></div>'; return; }
      render(d);
    }catch(e){ root.innerHTML='<div class="card"><div class="msg err">'+PT('No pudimos cargar tu perfil. Intenta de nuevo.','We could not load your profile. Try again.')+'</div></div>'; }
  }

  document.getElementById('logout').onclick=function(e){ e.preventDefault();
    sb.auth.signOut().then(function(){ showLogin({k:'info',t:PT('Sesión cerrada.','Signed out.')}); document.getElementById('logout').style.display='none'; }); };

  // ---- Retorno de Stripe tras pagar servicios extra (?addon=cs_...) ----
  var _addonDone=false;
  function addonBanner(kind,html){
    var b=document.createElement('div'); b.className='wrap'; b.style.paddingBottom='0';
    b.innerHTML='<div class="msg '+kind+'" style="margin-top:0">'+html+'</div>';
    if(root&&root.parentNode) root.parentNode.insertBefore(b,root); else document.body.appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },14000);
  }
  async function addonReturn(){
    if(_addonDone) return; _addonDone=true;
    var sid=null; try{ sid=new URLSearchParams(location.search).get('addon'); }catch(e){}
    if(!sid) return;
    try{ history.replaceState({},'',location.pathname+location.hash); }catch(e){}
    if(sid.indexOf('cs_')!==0) return;
    try{
      var r=await fetch(SUPA+'/functions/v1/grooming_extra',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({action:'addon_confirm',session_id:sid})});
      var d=await r.json();
      if(d&&d.ok){
        addonBanner('ok','<b>'+PT('¡Listo! Servicios agregados a tu cita.','All set! Services added to your appointment.')+'</b>'+
          (d.total?('<br>'+PT('Pagado','Paid')+': $'+Number(d.total).toFixed(2)):'')+
          '<br>'+PT('Te enviamos el recibo por correo.','We emailed you the receipt.'));
      }else if(d&&d.pending){
        addonBanner('info',PT('Tu pago se está procesando. En un momento verás los servicios en tu cita.','Your payment is processing. Your services will appear on the appointment shortly.'));
      }
    }catch(e){}
  }

  applyStatic();
  try{ var _pm=new URLSearchParams(location.search).get('pm'); if(_pm){ window._openPm=true; history.replaceState({},'',location.pathname+location.hash); } }catch(e){}
  sb.auth.getSession().then(function(s){ if(s.data&&s.data.session&&s.data.session.user){ addonReturn().then(load,load); } else showLogin(null); });
  sb.auth.onAuthStateChange(function(_e,session){ if(session&&session.user){ addonReturn().then(load,load); } });
})();
