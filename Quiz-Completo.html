<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BPuppy — Quiz Completo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="styles.css">
<script src="site-publish.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
body { background: #fff; color: var(--ink, #2D2421); min-height: 100vh; }
.quiz-page { max-width: 680px; margin: 0 auto; padding: 40px 24px 80px; }
.quiz-back { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 36px; transition: color .2s; }
.quiz-back:hover { color: #fff; }
.quiz-header { text-align: center; margin-bottom: 48px; }
.quiz-header h1 { font-family: var(--display); font-size: clamp(36px,6vw,56px); font-weight: 600; letter-spacing: -0.03em; line-height: 0.95; margin: 0 0 14px; color: var(--ink); }
.quiz-header h1 em { font-family: var(--serif); font-style: italic; color: var(--accent-2); font-weight: 400; }
.quiz-header p { color: var(--ink-soft); font-size: 16px; margin: 0; }

.eq-card { background: #fff; color: var(--ink); border-radius: 28px; padding: 36px; border: 1px solid var(--line); box-shadow: 0 4px 32px rgba(45,36,33,0.08); }
.eq-progress { display: flex; gap: 4px; margin-bottom: 28px; }
.eq-progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
.eq-progress span.done { background: var(--orange); }
.eq-step-label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); margin-bottom: 12px; }
.eq-question { font-family: var(--display); font-size: clamp(20px,3vw,28px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 24px; }
.eq-options { display: grid; gap: 10px; }
.eq-opt { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; background: var(--bg); border: 1.5px solid transparent; text-align: left; transition: all .2s; font-size: 15px; font-weight: 500; cursor: pointer; }
.eq-opt:hover { border-color: var(--orange); transform: translateY(-2px); }
.eq-opt.sel { background: var(--orange); color: #fff; border-color: var(--orange); }
.eq-opt .emoji { font-size: 22px; flex-shrink: 0; }
.eq-opt .desc { font-size: 12px; font-weight: 400; color: var(--ink-soft); margin-top: 2px; }
.eq-opt.sel .desc { color: rgba(255,255,255,0.8); }
.eq-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
.eq-nav-back { color: var(--ink-soft); font-size: 14px; font-weight: 500; padding: 8px 0; cursor: pointer; background: none; border: none; font-family: inherit; }
.eq-nav-back:hover { color: var(--ink); }
.eq-nav-back:disabled { opacity: 0; pointer-events: none; }

.eq-result { text-align: center; padding: 20px 0; }
.eq-result .match-pct { font-family: var(--display); font-size: 72px; font-weight: 700; line-height: 1; color: var(--orange); letter-spacing: -0.04em; }
.eq-result .match-lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
.eq-result h3 { font-family: var(--display); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin: 16px 0 8px; }
.eq-result p { color: var(--ink-2); font-size: 15px; line-height: 1.55; max-width: 44ch; margin: 0 auto 24px; }
.eq-result .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel">
const QUESTIONS = [
  { q: ['¿Dónde vives?', 'Where do you live?'], opts: [
    { label: ['Apartamento en ciudad', 'City apartment'], emoji: '🏢', desc: ['Espacio interior, poca área exterior', 'Indoor space, little outdoor area'] },
    { label: ['Casa con patio', 'House with a yard'], emoji: '🏡', desc: ['Jardín o patio para jugar', 'Garden or yard to play in'] },
    { label: ['Casa de campo', 'Country house'], emoji: '🌳', desc: ['Espacio abierto, mucho terreno', 'Open space, lots of land'] },
    { label: ['Estudio o espacio reducido', 'Studio or small space'], emoji: '🛋️', desc: ['Espacio mínimo', 'Minimal space'] },
  ]},
  { q: ['¿Cuál es tu principal motivación para tener un cachorro?', 'What’s your main reason for getting a puppy?'], opts: [
    { label: ['Compañía en casa', 'Companionship at home'], emoji: '💕', desc: ['Un compañero para el día a día', 'A companion for everyday life'] },
    { label: ['Estilo de vida activo', 'Active lifestyle'], emoji: '🏃', desc: ['Salir a correr, hacer ejercicio', 'Going for runs, exercising'] },
    { label: ['Apoyo emocional', 'Emotional support'], emoji: '🤗', desc: ['Necesito ese soporte especial', 'I need that special support'] },
    { label: ['Compañero para mis hijos', 'A companion for my kids'], emoji: '👶', desc: ['Una mascota para la familia', 'A pet for the family'] },
    { label: ['Compañía para adulto mayor', 'Companionship for a senior'], emoji: '🧓', desc: ['Acompañamiento y cariño', 'Company and affection'] },
  ]},
  { q: ['¿Qué tipo de pelaje prefieres?', 'What type of coat do you prefer?'], opts: [
    { label: ['Pelaje corto', 'Short coat'], emoji: '✂️', desc: ['Fácil de mantener', 'Easy to maintain'] },
    { label: ['Pelaje largo', 'Long coat'], emoji: '🐕‍🦺', desc: ['Me gusta cepillar y cuidar', 'I enjoy brushing and grooming'] },
    { label: ['Hipoalergénico', 'Hypoallergenic'], emoji: '🌿', desc: ['Tengo alergias o sensibilidad', 'I have allergies or sensitivities'] },
    { label: ['Me es indiferente', 'No preference'], emoji: '✨', desc: ['Lo que sea, con tal que sea lindo', 'Anything, as long as it’s cute'] },
  ]},
  { q: ['¿Cuánta actividad física puedes ofrecer?', 'How much physical activity can you offer?'], opts: [
    { label: ['Paseos cortos (15-20 min)', 'Short walks (15-20 min)'], emoji: '🚶', desc: ['Rutina tranquila', 'Easygoing routine'] },
    { label: ['Paseos moderados (30-60 min)', 'Moderate walks (30-60 min)'], emoji: '🎾', desc: ['Ejercicio equilibrado', 'Balanced exercise'] },
    { label: ['Ejercicio intenso (1-2 horas)', 'Intense exercise (1-2 hours)'], emoji: '🏃‍♂️', desc: ['Correr, hiking, deportes', 'Running, hiking, sports'] },
    { label: ['Todo el día al aire libre', 'All day outdoors'], emoji: '⛰️', desc: ['Campo, playa, montaña', 'Countryside, beach, mountains'] },
  ]},
  { q: ['¿Tienes experiencia con perros?', 'Do you have experience with dogs?'], opts: [
    { label: ['Es mi primer perro', 'It’s my first dog'], emoji: '🐣', desc: ['Nunca he tenido mascota', 'I’ve never had a pet'] },
    { label: ['Algo de experiencia', 'Some experience'], emoji: '🐕', desc: ['He tenido o convivido con perros', 'I’ve had or lived with dogs'] },
    { label: ['Mucha experiencia', 'Lots of experience'], emoji: '🎓', desc: ['He criado varias razas', 'I’ve raised several breeds'] },
  ]},
  { q: ['¿Qué tamaño prefieres?', 'What size do you prefer?'], opts: [
    { label: ['Pequeño (hasta 10 kg)', 'Small (up to 22 lb)'], emoji: '🐾', desc: ['Fácil de cargar y transportar', 'Easy to carry and travel with'] },
    { label: ['Mediano (10-25 kg)', 'Medium (22-55 lb)'], emoji: '🐕', desc: ['Versátil para cualquier espacio', 'Versatile for any space'] },
    { label: ['Grande (más de 25 kg)', 'Large (over 55 lb)'], emoji: '🦮', desc: ['Presencia fuerte, mucho amor', 'Strong presence, lots of love'] },
    { label: ['No me importa el tamaño', 'Size doesn’t matter'], emoji: '✨', desc: ['Sorpréndeme', 'Surprise me'] },
  ]},
  { q: ['¿Hay niños en tu hogar?', 'Are there children in your home?'], opts: [
    { label: ['Sí, menores de 5 años', 'Yes, under 5 years old'], emoji: '👶', desc: ['Necesito un perro muy paciente', 'I need a very patient dog'] },
    { label: ['Sí, entre 5 y 12 años', 'Yes, between 5 and 12'], emoji: '🧒', desc: ['Niños que ya saben ser cuidadosos', 'Kids who already know to be careful'] },
    { label: ['Adolescentes', 'Teenagers'], emoji: '👦', desc: ['13+ años', 'Ages 13+'] },
    { label: ['No hay niños', 'No children'], emoji: '🙋', desc: ['Solo adultos en casa', 'Only adults at home'] },
  ]},
  { q: ['¿Necesitas un perro entrenable para necesidades especiales?', 'Do you need a trainable dog for special needs?'], opts: [
    { label: ['Apoyo emocional', 'Emotional support'], emoji: '💆', desc: ['Ansiedad, depresión, estrés', 'Anxiety, depression, stress'] },
    { label: ['Compañero para persona autista', 'Companion for someone autistic'], emoji: '🧩', desc: ['Calma y conexión', 'Calm and connection'] },
    { label: ['Asistencia para adulto mayor', 'Assistance for a senior'], emoji: '🤝', desc: ['Compañía constante y tranquila', 'Constant, calm company'] },
    { label: ['No, mascota regular', 'No, a regular pet'], emoji: '🐶', desc: ['Solo quiero un amigo peludo', 'I just want a furry friend'] },
  ]},
  { q: ['¿Cuánto puedes dedicar al cuidado diario (cepillado, juego, paseo)?', 'How much time can you give to daily care (brushing, play, walks)?'], opts: [
    { label: ['Menos de 30 minutos', 'Less than 30 minutes'], emoji: '⏱️', desc: ['Vida muy ocupada', 'Very busy life'] },
    { label: ['30 min a 1 hora', '30 min to 1 hour'], emoji: '🕐', desc: ['Tiempo moderado', 'Moderate time'] },
    { label: ['1 a 2 horas', '1 to 2 hours'], emoji: '🕑', desc: ['Dedicado al cuidado', 'Dedicated to their care'] },
    { label: ['Todo el tiempo del mundo', 'All the time in the world'], emoji: '💯', desc: ['Mi cachorro es prioridad', 'My puppy is a priority'] },
  ]},
  { q: ['¿Qué es más importante para ti en un cachorro?', 'What matters most to you in a puppy?'], opts: [
    { label: ['Que sea cariñoso y tranquilo', 'Affectionate and calm'], emoji: '🥰', desc: ['Paz y ternura', 'Peace and tenderness'] },
    { label: ['Que sea juguetón y energético', 'Playful and energetic'], emoji: '⚡', desc: ['Diversión y acción', 'Fun and action'] },
    { label: ['Que sea protector y leal', 'Protective and loyal'], emoji: '🛡️', desc: ['Seguridad y confianza', 'Safety and confidence'] },
    { label: ['Que sea independiente', 'Independent'], emoji: '🐺', desc: ['No necesita atención constante', 'Doesn’t need constant attention'] },
  ]},
];

const BREEDS = [
  { name: 'Golden Retriever', art: 1, match: 96, desc: ['Cariñoso, inteligente, perfecto para familias. Se adapta a niños y adultos mayores con facilidad.', 'Affectionate, smart and perfect for families. Adapts easily to children and seniors.'], size: ['Grande', 'Large'], energy: ['Alta', 'High'] },
  { name: 'French Bulldog', art: 2, match: 92, desc: ['Compacto, cariñoso y adaptable a espacios pequeños. Ideal para apartamentos y vida tranquila.', 'Compact, affectionate and great for small spaces. Ideal for apartments and a relaxed life.'], size: ['Pequeño', 'Small'], energy: ['Baja', 'Low'] },
  { name: 'Cavalier King Charles', art: 0, match: 89, desc: ['El perro de compañía por excelencia. Dulce, tranquilo y perfecto para apoyo emocional.', 'The companion dog par excellence. Sweet, calm and perfect for emotional support.'], size: ['Pequeño', 'Small'], energy: ['Moderada', 'Moderate'] },
  { name: 'Labrador Retriever', art: 3, match: 94, desc: ['Activo, sociable y extremadamente entrenable. Excelente para familias activas con niños.', 'Active, social and highly trainable. Excellent for active families with kids.'], size: ['Grande', 'Large'], energy: ['Alta', 'High'] },
  { name: 'Poodle (Caniche)', art: 4, match: 91, desc: ['Hipoalergénico, inteligente y elegante. Viene en todos los tamaños. Ideal si tienes alergias.', 'Hypoallergenic, intelligent and elegant. Comes in every size. Ideal if you have allergies.'], size: ['Variable', 'Varies'], energy: ['Moderada', 'Moderate'] },
  { name: 'Beagle', art: 7, match: 87, desc: ['Juguetón, curioso y excelente con niños. Tamaño mediano, mucha personalidad.', 'Playful, curious and great with kids. Medium-sized, with tons of personality.'], size: ['Mediano', 'Medium'], energy: ['Alta', 'High'] },
];

function ExtendedQuiz() {
  const t = useT();
  const [step, setStep] = React.useState(0);
  const [answers, setAnswers] = React.useState(Array(QUESTIONS.length).fill(null));
  const total = QUESTIONS.length;
  const isResult = step >= total;

  const choose = (idx) => {
    const next = [...answers]; next[step] = idx; setAnswers(next);
    setTimeout(() => setStep(s => Math.min(s + 1, total)), 250);
  };
  const back = () => setStep(s => Math.max(s - 1, 0));
  const reset = () => { setStep(0); setAnswers(Array(total).fill(null)); };

  // Simple breed selection based on answers
  const getBreed = () => {
    const a = answers;
    // Hypoallergenic preference -> Poodle
    if (a[2] === 2) return BREEDS[4];
    // Small space + low activity -> French Bulldog
    if ((a[0] === 0 || a[0] === 3) && a[3] === 0) return BREEDS[1];
    // Emotional support -> Cavalier
    if (a[7] === 0 || a[7] === 1) return BREEDS[2];
    // Active lifestyle -> Labrador
    if (a[1] === 1 && a[3] >= 2) return BREEDS[3];
    // Kids -> Golden
    if (a[6] === 0 || a[6] === 1 || a[1] === 3) return BREEDS[0];
    // Playful preference -> Beagle
    if (a[9] === 1) return BREEDS[5];
    return BREEDS[0];
  };

  return (
    <div className="quiz-page">
      <a href="Home.html" className="quiz-back">{t(['← Volver al inicio', '← Back to home'])}</a>
      <div className="quiz-header">
        <h1>{t(['Quiz', 'The'])} <em>{t(['completo', 'full quiz'])}</em></h1>
        <p>{t(['10 preguntas para encontrar tu match perfecto', '10 questions to find your perfect match'])}</p>
      </div>

      <div className="eq-card">
        <div className="eq-progress">
          {Array.from({length: total}, (_, i) => (
            <span key={i} className={(step > i || isResult) ? 'done' : ''} />
          ))}
        </div>

        {!isResult ? (
          <>
            <div className="eq-step-label">{t(['Pregunta', 'Question'])} {step + 1} {t(['de', 'of'])} {total}</div>
            <h3 className="eq-question">{t(QUESTIONS[step].q)}</h3>
            <div className="eq-options">
              {QUESTIONS[step].opts.map((opt, i) => (
                <button key={i} className={`eq-opt ${answers[step] === i ? 'sel' : ''}`} onClick={() => choose(i)}>
                  <span className="emoji">{opt.emoji}</span>
                  <span style={{flex:1}}>
                    {t(opt.label)}
                    <div className="desc">{t(opt.desc)}</div>
                  </span>
                </button>
              ))}
            </div>
            <div className="eq-nav">
              <button className="eq-nav-back" onClick={back} disabled={step === 0}>{t(['← Atrás', '← Back'])}</button>
              <span style={{fontSize: 12, color: 'var(--ink-soft)'}}>{step + 1}/{total}</span>
            </div>
          </>
        ) : (() => {
          const breed = getBreed();
          return (
            <div className="eq-result">
              <div className="match-pct">{breed.match}%</div>
              <div className="match-lbl">{t(['Match perfecto', 'Perfect match'])}</div>
              <h3>{breed.name}</h3>
              <p>{t(breed.desc)}</p>
              <p style={{fontSize: 13, color: 'var(--ink-soft)', marginBottom: 16}}>{t(['Tamaño', 'Size'])}: {t(breed.size)} · {t(['Energía', 'Energy'])}: {t(breed.energy)}</p>
              {breed.art ? (
                <a href={`Blog.html?art=${breed.art}`} style={{display:'inline-flex', alignItems:'center', gap:6, marginBottom:18, fontSize:14, fontWeight:600, color:'var(--orange)'}}>
                  {t(['Conocer más sobre esta raza', 'Learn more about this breed'])}
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                </a>
              ) : null}
              <div className="actions">
                <a href="Solicitud.html" className="btn btn-primary">{t(['Solicita un', 'Request a'])} {breed.name.split(' (')[0]}
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                </a>
                <button className="btn btn-outline" onClick={reset}>{t(['Repetir quiz', 'Retake quiz'])}</button>
              </div>
              <a href="https://wa.me/18084928294" target="_blank" rel="noreferrer" style={{display: 'inline-flex', alignItems: 'center', gap: 8, marginTop: 20, fontSize: 14, fontWeight: 600, color: 'var(--orange)'}}>
                {t(['Hablar con un asesor sobre', 'Talk to an advisor about'])} {breed.name} →
              </a>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

function QuizRoot() {
  const [lang, setLang] = React.useState('es');
  React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  return (
    <LangContext.Provider value={{ lang, setLang }}>
      <Header overDark={false}/>
      <main style={{ paddingTop: 80 }}>
        <ExtendedQuiz />
      </main>
      <Footer/>
    </LangContext.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<QuizRoot />);
</script>

<script src="site-animations.js"></script>
<script src="claude-bridge.js"></script>
<script type="text/babel" src="chat-widget.jsx"></script>
</body>
</html>
