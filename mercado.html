<style>
/* ── Cabecera corta ──────────────────────────────────────────────────────
   Antes ocupaba media pantalla y los articulos no se veian hasta bajar. */
.mk-top { background:var(--bg-2); border-bottom:1px solid var(--line); padding:104px 0 20px; }
.mk-top h1 { font-family:var(--display); font-size:clamp(25px,3vw,38px); font-weight:600; letter-spacing:-0.03em; line-height:1.05; margin:0 0 6px; color:var(--ink); }
.mk-top h1 em { font-family:var(--serif); font-style:italic; color:var(--orange); font-weight:400; }
.mk-top p { font-size:14px; line-height:1.55; margin:0; color:var(--ink-2); max-width:64ch; text-wrap:pretty; }
/* El aviso de afiliados es obligatorio: visible, pero en una linea. */
.mk-nota { margin-top:10px; font-size:11.5px; line-height:1.55; color:var(--ink-soft); max-width:92ch; text-wrap:pretty; }
.mk-nota b { color:var(--ink-2); font-weight:700; }

/* ── Dos columnas: filtros al lado, articulos a lo ancho ─────────────── */
.mk-sec { padding:18px 0 76px; background:var(--bg); }
.mk-cols { display:grid; grid-template-columns:216px minmax(0,1fr); gap:26px; align-items:start; }
.mk-lat { position:sticky; top:98px; max-height:calc(100vh - 118px); overflow-y:auto; padding-right:4px; }
.mk-lat::-webkit-scrollbar { width:6px; }
.mk-lat::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }

.mk-busca { position:relative; margin-bottom:16px; }
.mk-busca input { width:100%; min-height:42px; padding:9px 34px; border:1px solid var(--line); border-radius:999px; background:var(--paper); font:inherit; font-size:13.5px; color:var(--ink); }
.mk-busca input:focus { outline:none; border-color:var(--orange); }
.mk-busca .lupa { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-soft); pointer-events:none; }
.mk-busca .equis { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:0; background:none; color:var(--ink-soft); font-size:15px; cursor:pointer; border-radius:50%; line-height:1; }
.mk-busca .equis:hover { color:var(--ink); background:var(--bg-2); }

.mk-gr { margin-bottom:16px; }
.mk-gr h3 { font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px; }
/* Seleccionado con contorno, nunca relleno. */
.mk-op { display:flex; align-items:center; gap:8px; width:100%; min-height:34px; padding:6px 11px; margin-bottom:2px; border:1px solid transparent; border-radius:9px; background:none; font:inherit; font-size:13px; font-weight:500; color:var(--ink-2); cursor:pointer; text-align:left; transition:border-color .14s, color .14s, background .14s; }
.mk-op:hover { background:var(--bg-2); color:var(--ink); }
.mk-op.on { border-color:var(--orange); color:var(--orange); font-weight:700; background:none; }
.mk-op svg { width:15px; height:15px; flex:none; }
.mk-op .n { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--ink-soft); }
.mk-op.on .n { color:var(--orange); }
.mk-limpiar { border:0; background:none; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; cursor:pointer; min-height:36px; padding:0 2px; }
.mk-limpiar:hover { color:var(--orange); }

/* ── Articulos ───────────────────────────────────────────────────────── */
.mk-head { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:12px; min-height:30px; }
.mk-cnt { font-size:12.5px; font-weight:600; color:var(--ink-soft); }
.mk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(192px,1fr)); gap:13px; }
.mk-card { display:flex; flex-direction:column; background:var(--paper); border:1px solid var(--line); border-radius:15px; overflow:hidden; transition:border-color .16s, transform .16s; }
.mk-card:hover { border-color:var(--orange); transform:translateY(-2px); }
.mk-pic { flex:none; position:relative; aspect-ratio:1; background:#fff; border-bottom:1px solid var(--line); overflow:hidden; }
.mk-pic img { position:absolute; inset:13px; width:calc(100% - 26px); height:calc(100% - 26px); object-fit:contain; }
.mk-body { padding:11px 13px 13px; display:flex; flex-direction:column; flex:1; }
.mk-tag { font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--orange); margin:0 0 5px; }
.mk-tag .mk-sep { color:var(--line); margin:0 1px; }
.mk-name { font-family:var(--display); font-size:14px; font-weight:700; letter-spacing:-0.01em; line-height:1.3; margin:0 0 5px; color:var(--ink); text-wrap:pretty; }
.mk-desc { font-size:12px; color:var(--ink-2); line-height:1.5; margin:0 0 11px; text-wrap:pretty; }
/* Anclado abajo: todas las fichas alineadas. */
.mk-go { margin-top:auto; display:inline-flex; align-items:center; justify-content:space-between; gap:8px; min-height:42px; padding:0 13px; border:1px solid var(--line); border-radius:999px; font-size:12.5px; font-weight:700; color:var(--ink-2); text-decoration:none; transition:border-color .15s, color .15s; }
.mk-go:hover { border-color:var(--orange); color:var(--orange); }
.mk-go svg { width:13px; height:13px; flex:none; }

.mk-vacio { border:1px dashed var(--line); border-radius:18px; padding:50px 28px; text-align:center; background:var(--paper); }
.mk-vacio p { font-size:14.5px; color:var(--ink-2); line-height:1.65; margin:0 auto; max-width:46ch; text-wrap:pretty; }
.mk-cargando { height:248px; border:1px solid var(--line); border-radius:15px; background:var(--paper); }

.mk-legal { padding:26px 0 54px; background:var(--bg); border-top:1px solid var(--line); }
.mk-legal p { font-size:12px; line-height:1.7; color:var(--ink-soft); margin:0; max-width:78ch; text-wrap:pretty; }

/* ── Movil: los filtros se guardan tras un boton ─────────────────────── */
.mk-abrir { display:none; }
@media (max-width:860px){
  .mk-top { padding:92px 0 15px; }
  .mk-cols { grid-template-columns:1fr; gap:0; }
  .mk-abrir { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border:1px solid var(--line); border-radius:999px; background:var(--paper); font:inherit; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; }
  .mk-abrir.on { border-color:var(--orange); color:var(--orange); }
  .mk-abrir svg { width:14px; height:14px; flex:none; }
  .mk-lat { position:static; max-height:none; overflow:visible; display:none; margin-bottom:16px; padding:14px 0 2px; border-bottom:1px solid var(--line); }
  .mk-lat.abierta { display:block; }
  .mk-op { min-height:44px; }
  .mk-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .mk-desc { display:none; }
  .mk-tag .mk-sep, .mk-tag .mk-tienda { display:none; }
}
</style>

</section>
