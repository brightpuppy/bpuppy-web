  window.interes=interes;
  function render(d){
    var pups = d.puppies||[]; window._PUPS = pups;
    if(!pups.length){ app.innerHTML = stateBox(pawIcon,'Catálogo vacío','Tu asesor todavía está preparando tu selección. Escríbenos y te lo enviamos enseguida.', true); return; }
    var crop = d.crop_logos !== false;
    var hello = d.client_name ? ('<div class="hello">Hola, '+esc(d.client_name)+'</div>') : '<div class="hello">Selección personalizada</div>';
    var title = d.label ? esc(d.label) : 'Cachorritos elegidos <em>para ti</em>';
    var note = d.note ? '<p>'+esc(d.note)+'</p>' : '<p>Estos son los cachorros que seleccionamos especialmente para ti. Toca <b>Me interesa</b> en el que te enamore y seguimos por WhatsApp.</p>';

    var cards = pups.map(function(p, i){
      var photos = photosOf(p); GAL[i]=photos;
      var ph = photos[0]||'';
      var reserved = (p.status==='reserved');
      var isSourced = !!p.sourced;
      var cropCls = (crop && isSourced) ? ' crop' : '';
      var brand = isSourced ? '<div class="brandmark"><span class="dot"></span>BrightPuppy</div>' : '';
      var count = photos.length>1 ? '<span class="gcount">'+photos.length+' fotos</span>' : '';
      var meta = [];
      var g = genderEs(p.gender); if(g) meta.push(g);
      if(p.color) meta.push(esc(p.color));
      var a = p.age_text ? esc(p.age_text) : ageEs(p.age_weeks); if(a) meta.push(a);
      var det=[];
      if(p.pedigree) det.push([T('Pedigrí','Pedigree'),(p.pedigree==='Sí'?T('Sí','Yes'):(p.pedigree==='No'?T('No','No'):esc(p.pedigree)))]);
      if(p.microchip) det.push([T('Microchip','Microchip'),(p.microchip==='Sí'?T('Sí','Yes'):(p.microchip==='No'?T('No','No'):esc(p.microchip)))]);
      if(p.born) det.push([T('Nacimiento','Born'),esc(p.born)]);
      var detH = det.length? '<div style="margin-top:8px;display:flex;flex-direction:column;gap:3px">'+det.map(function(x){return '<div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--ink-soft)">'+x[0]+'</span><span style="font-weight:600;color:var(--ink-2)">'+x[1]+'</span></div>';}).join('')+'</div>':'';
      var bi = breedInfo(p.breed); var biH='';
      if(bi && (bi.temperament.length||bi.care||bi.coats.length||bi.desc)){
        var rows='';
        if(bi.temperament.length) rows += '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">'+bi.temperament.map(function(tp){return '<span class="chip">'+esc(tp)+'</span>';}).join('')+'</div>';
        if(bi.coats.length) rows += '<div style="font-size:12.5px;margin-bottom:5px"><b>'+T('Pelaje','Coat')+':</b> '+esc(bi.coats.join(', '))+'</div>';
        if(bi.care) rows += '<div style="font-size:12.5px;margin-bottom:5px"><b>'+T('Cuidado','Care')+':</b> '+esc(bi.care)+'</div>';
        if(bi.desc) rows += '<div style="font-size:12.5px;color:var(--ink-2);line-height:1.55">'+esc(bi.desc)+'</div>';
        biH = '<details style="margin-top:10px;border-top:1px solid var(--line);padding-top:9px"><summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--orange)">'+T('Sobre la raza','About the breed')+'</summary><div style="margin-top:9px">'+rows+'</div></details>';
      }
      var waText = 'Hola! Me interesa '+(p.name? p.name+' ' : '')+'('+(p.breed||'cachorro')+') que vi en mi catálogo. ¿Sigue disponible?';
      var thumbs = photos.length>1 ? '<div class="thumbs">'+photos.slice(0,10).map(function(u,idx){ return '<img src="'+esc(u)+'" class="'+(idx===0?'on':'')+'" referrerpolicy="no-referrer" onerror="this.remove()" onclick="gswap('+i+','+idx+',this)">'; }).join('')+'</div>' : '';
      return '<div class="card">'
        + '<div class="photo'+cropCls+'">'
          + (ph? '<img id="gm-'+i+'" data-idx="0" src="'+esc(ph)+'" alt="'+esc(p.breed||'Cachorro')+'" loading="lazy" referrerpolicy="no-referrer" style="cursor:zoom-in" onclick="lbxOpen('+i+')" onerror="this.style.display=\'none\'">' : '<div class="ph-empty">'+pawIcon+'</div>')
          + brand + count
          + '<span class="badge '+(reserved?'reserved':'available')+'">'+(reserved?T('Reservado','Reserved'):T('Disponible','Available'))+'</span>'
        + '</div>'
        + thumbs
        + '<div class="body">'
          + '<div class="breed">'+esc(p.breed||'')+'</div>'
          + (p.name? '<h3>'+esc(p.name)+'</h3>':'')
          + (meta.length? '<div class="meta">'+meta.map(function(m){return '<span class="chip">'+m+'</span>';}).join('')+'</div>':'')
          + '<div class="price">'+money(p.price)+(p.price!=null&&!isNaN(p.price)?' <small>USD</small>':'')+'</div>'
          + detH
          + biH
          + '<button class="cta" onclick="interes('+i+')" style="border:none;cursor:pointer;width:100%;font-family:inherit">'+T('Me interesa','I am interested')+'</button>'
        + '</div>'
      + '</div>';
    }).join('');

    app.innerHTML = '<div class="wrap"><div class="hero">'+hello+'<h1>'+title+'</h1>'+note+'</div>'
      + '<div class="grid">'+cards+'</div></div>';
  }

  if(!token){ app.innerHTML = stateBox(lockIcon,'Enlace no válido','Este enlace no incluye un código de catálogo. Pídele a tu asesor que te lo reenvíe.', true); return; }

  fetch(SUPA+'/functions/v1/catalog_view', {
    method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':ANON, 'Authorization':'Bearer '+ANON },
    body: JSON.stringify({ token: token })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok){ render(d); return; }
    var reason = d && d.reason;
    if(reason==='expired') app.innerHTML = stateBox(clockIcon,'Tu enlace expiró','Por seguridad, los catálogos son temporales. Escríbenos y con gusto te enviamos uno nuevo y actualizado.', true);
    else if(reason==='revoked') app.innerHTML = stateBox(lockIcon,'Enlace desactivado','Este catálogo ya no está activo. Pídele a tu asesor un enlace nuevo.', true);
    else app.innerHTML = stateBox(lockIcon,'Enlace no válido','No encontramos este catálogo. Verifica el enlace o pídele a tu asesor que te lo reenvíe.', true);
  }).catch(function(){
    app.innerHTML = stateBox(clockIcon,'Algo salió mal','No pudimos cargar tu catálogo en este momento. Intenta de nuevo o escríbenos por WhatsApp.', true);
  });
})();
</script>
</body>
</html>
